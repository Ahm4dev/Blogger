<style>

const ASR={
E:["الوجود","Existence","الأصول والالتزامات وحقوق الملكية المسجلة موجودة فعلًا في تاريخ القوائم المالية.","يعالج خطر التضخيم (Overstatement) بتسجيل أصول وهمية أو أرصدة غير موجودة؛ الاختبار يبدأ من السجلات ويتجه إلى الدليل المادي أو الخارجي (Vouching).","المصادقات الخارجية، الجرد والمعاينة المادية، فحص المستندات الأصلية، المقبوضات اللاحقة."],
O:["الحدوث","Occurrence","المعاملات والأحداث المسجلة قد حدثت فعلًا وتخص المنشأة.","يعالج خطر تسجيل إيرادات أو مصروفات وهمية (Fictitious Transactions)؛ الاختبار من القيد في الدفاتر إلى المستند المؤيد ودليل التنفيذ.","Vouching من الأستاذ العام إلى الفاتورة وأمر البيع ومستند الشحن واستلام العميل، الإجراءات التحليلية، اختبار القيود اليدوية."],

A:["الدقة","Accuracy","المبالغ والبيانات المتعلقة بالمعاملات سُجلت بشكل مناسب وصحيح حسابيًا.","يعالج أخطاء التسعير والكميات والحساب والترحيل وسعر الصرف.","إعادة الاحتساب (Recalculation)، مطابقة الأسعار مع قوائم الأسعار والعقود، إعادة الأداء (Reperformance)."],

CL:["التبويب","Classification","المعاملات والأرصدة سُجلت في الحسابات الصحيحة.","يعالج خطر التبويب الخاطئ بين المتداول وغير المتداول، أو بين الرأسمالي والإيرادي، أو بين البنود التشغيلية وغير التشغيلية.","فحص طبيعة المعاملة مقابل دليل الحسابات، اختبار الرسملة، مراجعة التبويب في القوائم."],
V:["التقييم","Valuation","الأصول والالتزامات وحقوق الملكية مدرجة بمبالغ مناسبة وفق الإطار المحاسبي.","يعالج خطر عدم تكوين مخصصات كافية، أو الإدراج بأعلى من القيمة القابلة للاسترداد أو صافي القيمة البيعية، أو أخطاء التقديرات والقيمة العادلة.","اختبار ECL وNRV والانخفاض في القيمة، مراجعة التقديرات وفق ISA 540، إعادة احتساب الاستهلاك، الاستعانة بخبراء."],

R:["الحقوق والالتزامات","Rights & Obligations","المنشأة تمتلك أو تسيطر على الأصول، والالتزامات هي التزامات على المنشأة.","يعالج خطر إدراج أصول مملوكة للغير (بضاعة أمانة، أصول مرهونة أو مؤجرة) أو التزامات لا تخص المنشأة.","فحص عقود الملكية وسندات التسجيل، المصادقات البنكية حول الرهون، فحص العقود والاتفاقيات ومحاضر مجلس الإدارة."],

const DEFF=["القصور (Deficiency): ضابط مصمم أو مطبق أو يعمل بطريقة لا تمنع أو تكتشف وتصحح التحريفات في الوقت المناسب، أو غياب ضابط ضروري.","القصور الجوهري/المهم (Significant Deficiency): قصور أو مجموعة قصور يرى المراجع أهميتها بما يستحق انتباه المكلفين بالحوكمة — يُبلغ كتابيًا (ISA 265.9).","مؤشرات القصور المهم: اكتشاف احتيال من الإدارة العليا، تحريفات جوهرية لم تكتشفها الضوابط، إعادة إصدار قوائم سابقة، ضعف بيئة الرقابة، غياب إجراءات تقييم المخاطر.","عوامل التقييم: احتمال أن يؤدي القصور لتحريف جوهري، حجم التحريف المحتمل، الحسابات المتأثرة، وجود ضوابط تعويضية، طبيعة الخطر (احتيال/تعقيد/حكم).","تُبلغ القصورات الأخرى ذات الأهمية للإدارة بالمستوى المناسب (خطاب الإدارة Management Letter)."];

const SAMP=[
["الأهمية النسبية","Materiality (ISA 320)",["تُحدد الأهمية النسبية الكلية للقوائم ككل باختيار معيار مناسب (Benchmark) وتطبيق نسبة بالحكم المهني، مع توثيق مبررات الاختيار في B-04.","عوامل اختيار المعيار: عناصر القوائم التي يركز عليها المستخدمون، طبيعة المنشأة ومرحلة دورة حياتها، هيكل الملكية والتمويل، تقلب المعيار.","تُعدّل الأهمية خلال المراجعة إذا علم المراجع بمعلومات كانت ستؤدي لتحديد مبلغ مختلف (ISA 320.12)، وتُوثق المراجعة النهائية للأهمية في الإقفال."],"B-01 B-04"],
["أهمية الأداء","Performance Materiality",["تُحدد بمبلغ أقل من الأهمية الكلية لتخفيض احتمال أن يتجاوز مجموع التحريفات غير المصححة وغير المكتشفة الأهمية النسبية.","العوامل: نتائج المراجعات السابقة، عدد وحجم التحريفات السابقة، فعالية الضوابط، خطر الاحتيال، كون الارتباط أول مرة.","تستخدم أهمية الأداء لتحديد نطاق الاختبار وحجم العينات والحد المقبول للفروق في الإجراءات التحليلية."],"B-02"],
["حد الضآلة الواضحة","Clearly Trivial Threshold (ISA 450.A2)",["التحريفات الأقل من هذا الحد لا تحتاج للتجميع لأنها واضحة الضآلة فرديًا ومجمعة.","غالبًا 3%–5% من الأهمية الكلية، ويُخفض في وجود مؤشرات احتيال.","التحريفات النوعية (احتيال، أطراف ذات علاقة، مخالفة قانون) تُقيم بغض النظر عن الحد."],"B-03"],
["خطر العينة","Sampling Risk",["خطر أن يختلف استنتاج المراجع من العينة عن الاستنتاج لو تم اختبار المجتمع كاملًا.","في اختبارات الرقابة: خطر الاعتماد الزائد (Over-reliance) أخطر من خطر الاعتماد الناقص.","في الاختبارات الجوهرية: خطر القبول الخاطئ (Incorrect Acceptance) أخطر من خطر الرفض الخاطئ.","الخطر غير المرتبط بالعينة (Non-sampling Risk) يُعالج بالإشراف والتدريب واختيار الإجراء المناسب."],"D-01"],
["العينات الإحصائية وغير الإحصائية","Statistical vs Non-statistical Sampling",["الإحصائية: اختيار عشوائي وتقييم النتائج باستخدام نظرية الاحتمالات لقياس خطر العينة كميًا (MUS، Attribute Sampling).","غير الإحصائية: حكم مهني في الحجم والتقييم، ويجب أن يكون الحجم مماثلًا تقريبًا للإحصائية المقابلة، والاختيار بطريقة تجعل كل عنصر له فرصة اختيار.","لا يجوز استخدام الاختيار الجزافي (Haphazard) في العينات الإحصائية."],"D-04 D-05 D-06"],
["طرق الاختيار","Selection Methods",["العشوائي (Random): مولد أرقام عشوائية مع توثيق البذرة (Seed).","المنتظم (Systematic): فترة = حجم المجتمع ÷ حجم العينة مع نقطة بداية عشوائية؛ احذر من الأنماط المنتظمة في المجتمع.","النقدية (MUS): كل وحدة نقدية لها فرصة متساوية، مناسبة لاختبار التضخيم (Existence/Valuation).","الاختيار المحدد (Specific/Key Items): البنود الكبيرة والشاذة تُختبر 100% ولا تعتبر عينة تُسقط نتائجها."],"D-07 D-08 D-09 D-12"],
["اكتمال المجتمع","Population Completeness",["طابق إجمالي المجتمع المستخرج مع الأستاذ العام قبل اختيار العينة.","تحقق من معايير الاستخراج (الفترة، الحسابات، الكيانات) واختبر موثوقية التقرير (IPE).","لاختبار الاكتمال، اختر من مجتمع مختلف (مستندات الشحن/الاستلام) وليس من الدفاتر."],"D-02 D-03 C-20"],
["تقييم وإسقاط التحريفات","Evaluation & Projection",["حلل طبيعة وسبب كل انحراف أو تحريف (Anomaly نادر جدًا ويحتاج دليلًا قويًا).","أسقط التحريف على المجتمع (طريقة النسبة أو الفرق أو التلوث في MUS).","قارن التحريف المُسقط + الخطر الإضافي مع الخطأ المقبول؛ إن تجاوزه: وسّع العينة أو طبق إجراءات بديلة أو اطلب من الإدارة فحص المجتمع كاملًا وتصحيحه.","يُرحَّل التحريف المُسقط كتحريف مسقط (Projected) في ملخص التحريفات W-06."],"D-15 D-16 W-07"]];

ctl:["إعداد تسويات بنكية شهرية لكل حساب من موظف مستقل عن التحصيل والسداد ومراجعتها واعتمادها من المدير المالي خلال 10 أيام.","توقيع مزدوج (Dual Signatories) على المدفوعات فوق حد معين وفق مصفوفة الصلاحيات.","حصر صلاحية فتح وإغلاق الحسابات البنكية بقرار من مجلس الإدارة.","جرد مفاجئ دوري للنقدية والعهد من شخص مستقل.","الفصل بين حيازة النقدية وتسجيلها والتسوية."],
pr:[["REC","E,C,A","أعد جدول النقدية الرئيسي E-01 بقائمة كل الحسابات البنكية والصناديق والودائع، وطابق الإجماليات مع ميزان المراجعة والأستاذ العام، وقارن مع السنة السابقة وحدد الحسابات المفتوحة/المغلقة خلال السنة من المصادقات ومحاضر المجلس.","Lead Schedule مطابق للـ TB","E-01"],
["CONF","E,C,R,D","أرسل مصادقات بنكية E-05 لجميع البنوك التي تعاملت معها المنشأة خلال السنة (بما فيها الحسابات المغلقة والصفرية) بالنموذج الموحد، تتضمن: الأرصدة، القروض والتسهيلات، الضمانات والاعتمادات، الرهون، المفوضين بالتوقيع، وسيطر على الإرسال والاستلام، ولخص النتائج في E-06.","ردود البنوك الأصلية المستلمة مباشرة","E-05 E-06"],
["REC","E,C,A","لكل حساب جوهري: أعد أداء التسوية البنكية E-04 في نهاية السنة — طابق رصيد الكشف مع المصادقة، والرصيد الدفتري مع الأستاذ العام، وتحقق من الجمع، وافحص بنود التسوية: الشيكات المعلقة E-07 بتتبعها لكشف البنك اللاحق (مع التحقق من تاريخ الشيك ومن المستفيد)، والإيداعات بالطريق E-08 بتتبعها لكشف البنك خلال أيام قليلة، وحقق في البنود القديمة أو غير العادية.","كشوف البنك لشهر ما بعد السنة","E-04 E-07 E-08"],
["CUT","E,CO","أعد جدول التحويلات بين الحسابات E-09 لأسبوع قبل وبعد نهاية السنة: تاريخ السحب والإيداع في الكشفين وتاريخ التسجيل في الدفاتر، وحدد أي تحويل مسجل كإيداع قبل نهاية السنة وسحبه بعدها (Kiting).","جدول التحويلات مع الكشوف","E-09 E-10"],
["EX","E","نفذ جردًا مفاجئًا للنقدية بالصندوق والعهد E-02/E-03 في تاريخ نهاية السنة أو قريبًا منه بحضور أمين الصندوق، واجرد كل الصناديق بالتزامن، وطابق مع دفتر النقدية، وافحص المستندات غير المعوضة والسلف (IOUs) وحصل على توقيع أمين الصندوق على ورقة الجرد.","ورقة الجرد الموقعة","E-02 E-03"],
["VAL","V,A","أعد احتساب ترجمة الأرصدة بالعملات الأجنبية بسعر الإقفال الرسمي في تاريخ القوائم (البنك المركزي)، وطابق فروق العملة مع قائمة الدخل.","نشرة أسعار الصرف الرسمية","E-01 Y-03"],
["RO","R,CL,D","حدد النقدية المقيدة E-13 من المصادقات البنكية والعقود (هوامش خطابات الضمان والاعتمادات، حسابات الضمان، الودائع المرهونة) وتحقق من فصلها عن النقدية وما في حكمها والإفصاح عن القيود.","المصادقات والعقود","E-13"],
["PD","CL,P,D","تحقق من التبويب: الودائع ذات الاستحقاق الأصلي > 3 أشهر كاستثمارات قصيرة الأجل، السحب على المكشوف كالتزام (أو جزء من النقدية في قائمة التدفقات عندما يكون جزءًا من إدارة النقد — IAS 7.8)، وعدم مقاصة الأرصدة الدائنة والمدينة لبنوك مختلفة.","القوائم المالية والإيضاح","E-01 V-06"],
["TOD","E,O","افحص المقبوضات والمدفوعات اللاحقة لنهاية السنة E-11/E-12 لدعم اختبارات المدينين والدائنين وتحديد مدفوعات تخص الفترة غير مسجلة.","كشوف البنك اللاحقة","E-11 E-12"]],
ev:"مصادقات بنكية مستلمة مباشرة، كشوف حسابات أصلية لشهر نهاية السنة والشهر التالي، تسويات بنكية معتمدة، أوراق جرد نقدية موقعة، أسعار صرف رسمية.",src:"كشوف الحسابات البنكية، دفتر النقدية، التسويات البنكية، دفاتر الشيكات، إشعارات الإيداع والخصم، عقود الودائع وخطابات الضمان.",alt:"عند عدم ورود المصادقة البنكية: الحصول على كشف الحساب مباشرة من البنك أو عبر الدخول للخدمات البنكية الإلكترونية تحت ملاحظة المراجع مع لقطات شاشة مؤرخة، وفحص تطابق الأرصدة مع كشوف الشهر التالي.",exp:"تطابق رصيد الدفاتر مع رصيد البنك المؤكد بعد بنود تسوية مؤيدة تُسوى خلال أيام قليلة بعد نهاية السنة.",exc:"شيكات معلقة قديمة (Stale Cheques) يجب إعادة قيدها كالتزام، إيداعات بالطريق لم تظهر في الكشف اللاحق، حسابات لم تُسجل، رهون غير مفصح عنها، عجز بالصندوق.",fu:"اقتراح تسوية للشيكات القديمة، التحقيق في الإيداعات غير المسواة كمؤشر احتيال، تحديث الإفصاح عن القيود والرهون، إبلاغ قصور التسويات البنكية."},

pr:[["REC","E,C,A","أعد جدول المدينين الرئيسي F-01 وطابق الأستاذ المساعد للعملاء مع الأستاذ العام وميزان المراجعة، وتحقق من الجمع، وحدد الأرصدة الدائنة لإعادة تبويبها.","Lead Schedule، الأستاذ المساعد","F-01 Y-03"],

["CONF","E,R,A","اختر عينة للمصادقة الإيجابية F-03/F-04 (جميع الأرصدة الكبيرة فوق أهمية الأداء + عينة عشوائية/MUS من الباقي + أرصدة غير عادية: قديمة، دائنة، أطراف ذات علاقة، أرصدة صفرية لعملاء رئيسيين)، تحقق من العناوين باستقلالية، أرسل وسيطر، وحقق في الفروق.","سجل المصادقات والردود","F-03 F-04 Y-09"],

["TOD","E,V","للمصادقات غير المستلمة والمستثناة نفذ إجراءات بديلة F-06: تتبع المتحصلات اللاحقة F-07 إلى كشف البنك وربطها بالفواتير المحددة القائمة في نهاية السنة؛ وللأرصدة غير المحصلة افحص الفاتورة وأمر البيع ومستند التسليم الموقع من العميل والعقد.","كشوف البنك اللاحقة، مستندات التسليم","F-06 F-07"],

ctl:["تعليمات جرد مكتوبة، فرق عد مستقلة عن أمناء المخازن، بطاقات جرد مرقمة مسبقًا ومراقبة تسلسلها.","جرد دوري/مستمر (Cycle Counts) وتسوية الفروق باعتماد مستقل.","مراجعة دورية لتقارير بطء الحركة والتقادم من لجنة مختصة.","مطابقة ثلاثية (أمر شراء/إذن استلام/فاتورة) قبل التسجيل.","تحديث بطاقات التكلفة المعيارية ومراجعة الانحرافات شهريًا.","قيود الوصول المادي للمخازن والأنظمة."],
pr:[["REC","E,C,A","أعد جدول المخزون الرئيسي G-01 حسب الفئة والموقع، وطابق قائمة المخزون النهائية التفصيلية مع الأستاذ العام G-02، وتحقق من جمع القائمة وضرب الكمية × التكلفة (باستخدام CAATs على الملف الكامل).","قائمة المخزون، TB","G-01 G-02"],
["EX","E,C","احضر الجرد G-03/G-04: راجع التعليمات مسبقًا، لاحظ التزام فرق الجرد، تأكد من توقف الحركة أو ضبطها، حدد البضاعة التالفة وبطيئة الحركة وبضاعة الغير، وسجل أرقام آخر أذون استلام وصرف.","أوراق الملاحظة","G-03 G-04"],
["EX","E,C","نفذ عدًّا اختباريًا G-05 في الاتجاهين: من السجلات إلى الأرض (Sheet-to-Floor G-07) للوجود — مع التركيز على الأصناف عالية القيمة — ومن الأرض إلى السجلات (Floor-to-Sheet G-06) للاكتمال، ثم تتبع العد الاختباري ونطاق بطاقات الجرد إلى القائمة النهائية المسعّرة.","بطاقات الجرد، القائمة النهائية","G-05 G-06 G-07"],
["CUT","CO,E,C","اختبر الفصل الزمني G-08 باستخدام آخر أذون الاستلام G-09 والصرف G-10 المسجلة في الجرد: تحقق أن الاستلامات قبل الجرد مدرجة في المخزون وفي الدائنين، والصرف قبل الجرد مستبعد من المخزون ومسجل كمبيعات.","أذون الاستلام والصرف","G-08 G-09 G-10"],
["VAL","V,A","اختبر التكلفة G-11 لعينة أصناف: للمشتراة طابق مع فواتير الشراء الحديثة وفق طريقة التكلفة (FIFO/المتوسط المرجح) مع إضافة الرسوم والنقل واستبعاد الخصومات؛ للمصنعة اختبر بطاقة التكلفة: المواد والعمالة المباشرة والتكاليف الصناعية المحملة على أساس الطاقة العادية (IAS 2.13) مع استبعاد التكاليف غير العادية والإدارية والبيعية.","فواتير الشراء، بطاقات التكلفة","G-11"],
["VAL","V","اختبر صافي القيمة البيعية G-12: قارن تكلفة عينة أصناف (خصوصًا البطيئة وذات الهامش المنخفض) بسعر البيع الفعلي في فواتير بعد نهاية السنة ناقصًا تكاليف الإتمام والبيع.","فواتير البيع اللاحقة","G-12"],
["VAL","V","اختبر مخصص بطء الحركة والتقادم G-13/G-14/G-15: اختبر دقة تقرير تاريخ آخر حركة، أعد تطبيق سياسة المخصص، قيّم معقولية النسب مقابل الاستخدام الفعلي والمبيعات اللاحقة، وراجع الحركة على المخصص (الاستخدام مقابل الرد).","تقرير الأعمار، المبيعات اللاحقة","G-13 G-14 G-15 P-08"],
["RO","R,E","للبضاعة بالطريق G-16 افحص بوليصة الشحن وشروط Incoterms لتحديد انتقال المخاطر؛ للمخزون لدى الغير (مستودعات، أمانة) صادق مع الحائز أو احضر الجرد؛ واستبعد بضاعة الغير من القائمة.","بوالص الشحن، المصادقات","G-16 Y-09"],
["SAP","V,E","حلل معدل دوران المخزون وأيام المخزون وهامش الربح الإجمالي حسب خط المنتج، وقارن بالسنة السابقة والقطاع، وحقق في الانخفاض غير المفسر للدوران كمؤشر تقادم.","تحليل النسب","G-01 Y-05"],
["EX","E,C","عند اختلاف تاريخ الجرد عن تاريخ القوائم: نفذ Roll-forward G-17 أو Roll-back G-18 باختبار المشتريات والمبيعات والإنتاج بين التاريخين مع اختبار فصل زمني إضافي.","جدول الحركة","G-17 G-18"],
["PD","P,D,R","تحقق من الإفصاح عن السياسة وطرق التكلفة، والتحليل حسب الفئة، وقيمة التخفيض والرد، والمخزون المرهون (IAS 2.36).","مسودة الإيضاح","V-04"]],
ev:"أوراق ملاحظة الجرد والعد الاختباري، قائمة المخزون النهائية، فواتير الشراء والبيع، بطاقات التكلفة، مصادقات الغير، بوالص الشحن.",src:"بطاقات الجرد، أذون الاستلام والصرف، أوامر الإنتاج، تقارير التكلفة، تقارير الأعمار.",alt:"إذا تعذر حضور الجرد: جرد في تاريخ لاحق مع Roll-back، فحص المبيعات اللاحقة لأصناف محددة، مصادقة الحائز؛ وإن استحال ذلك يُعدل الرأي (ISA 501.7).",exp:"فروق جرد ضئيلة ضمن حد الضآلة، تكلفة متسقة مع الفواتير، مخصص كافٍ.",exc:"فروق عد، أصناف تالفة غير مخصصة، تكلفة أعلى من NRV، تحميل طاقة عاطلة، بضاعة أمانة مدرجة.",fu:"إسقاط فروق العد، اقتراح تسويات المخصص والتكلفة، توسيع العد الاختباري، إبلاغ ضعف ضوابط الجرد."},

 ["Z-05","SOCPA Requirements Checklist","قائمة متطلبات الهيئة السعودية للمراجعين والمحاسبين","chk","200 220 700","التحقق من متطلبات الهيئة السعودية للمراجعين والمحاسبين ذات الصلة بالارتباط (المعايير المعتمدة، قواعد السلوك، الترخيص، التقرير). (بحاجة لمراجعة مهني لتحديث المتطلبات النافذة).",["هل يُطبق الارتباط المعايير الدولية للمراجعة المعتمدة في المملكة مع أي متطلبات إضافية معتمدة؟","هل تُطبق المعايير الدولية للتقرير المالي المعتمدة في المملكة والإفصاحات الإضافية المطلوبة؟","هل ترخيص المكتب والشريك الموقع ساري ويغطي نوع المنشأة (مثل الشركات المدرجة)؟","هل التزم الفريق بقواعد السلوك والأخلاقيات المهنية المعتمدة بما في ذلك الاستقلال؟","هل التزم المكتب بمتطلبات تدوير الشريك المطبقة على المنشأة؟","هل يتضمن تقرير المراجع الصياغة المعتمدة والمتطلبات النظامية الإضافية (نظام الشركات، متطلبات هيئة السوق المالية عند الاقتضاء)؟","هل استُوفيت متطلبات إدارة الجودة على مستوى المكتب (ISQM 1) ومراجعة جودة الارتباط عند الاقتضاء؟"]],
 ["Z-06","ISSA 5000 Sustainability Assurance Planning","تخطيط ارتباط تأكيد الاستدامة (ISSA 5000)","chk","220","قائمة تخطيط استرشادية لارتباط تأكيد معلومات الاستدامة وفق المعيار الدولي لتأكيد الاستدامة ISSA 5000. (بحاجة لمراجعة مهني: الصياغة استرشادية وليست من نص المعيار).",["هل تم تحديد مستوى التأكيد (محدود/معقول) ونطاق المعلومات المشمولة بوضوح في شروط الارتباط؟","هل المعايير المطبقة (مثل IFRS S1 وS2 أو أطر أخرى) مناسبة ومتاحة للمستخدمين؟","هل تم فهم عملية إعداد معلومات الاستدامة ونظم جمع البيانات وسلسلة القيمة؟","هل تم تقييم كفاءة الفريق والحاجة إلى خبراء (انبعاثات، بيئة، اجتماعي)؟","هل تم تحديد الأهمية النسبية للإفصاحات الكمية والنوعية؟","هل تم تحديد مخاطر التحريف الجوهري بما فيها المعلومات التطلعية والتقديرات؟","هل تم التنسيق مع مراجع القوائم المالية بشأن الاتساق بين المعلومات المالية ومعلومات الاستدامة؟"]],

TPL.push({id:'engletter',cat:'eng',ar:'خطاب الارتباط',en:'Engagement Letter',isa:'210',wp:'A-05',desc:'الاتفاق على شروط ارتباط المراجعة قبل البدء: الهدف والنطاق، مسؤوليات المراجع، مسؤوليات الإدارة (الشرط المسبق للمراجعة)، الإطار، الشكل المتوقع للتقرير.',

secs:[
['head','',['{{city}} في {{rdate}}','السادة/ {{tcwg}}','شركة {{company}}','الموضوع: خطاب ارتباط لمراجعة القوائم المالية عن السنة المالية المنتهية في {{period}}']],
['obj','الهدف من المراجعة ونطاقها (Objective and Scope)',['لقد طلبتم منا مراجعة القوائم المالية لشركة {{company}}، والتي تشمل قائمة المركز المالي في {{period}}، وقوائم الأرباح أو الخسائر والدخل الشامل الآخر والتغيرات في حقوق الملكية والتدفقات النقدية عن السنة المنتهية في ذلك التاريخ، والإيضاحات المتممة لها بما في ذلك ملخص للسياسات المحاسبية الهامة. ويسعدنا أن نؤكد قبولنا لهذا الارتباط وفهمنا له بموجب هذا الخطاب.','تتمثل أهدافنا في الحصول على تأكيد معقول عما إذا كانت القوائم المالية ككل خالية من التحريف الجوهري، سواء بسبب غش أو خطأ، وإصدار تقرير مراقب الحسابات الذي يتضمن رأينا. والتأكيد المعقول هو مستوى عالٍ من التأكيد، ولكنه ليس ضمانًا بأن المراجعة التي تتم وفقًا لـ {{stdname}} ستكشف دائمًا عن التحريف الجوهري عند وجوده.']],
['aud','مسؤوليات المراجع (Responsibilities of the Auditor)',['سنقوم بالمراجعة وفقًا لـ {{stdname}}، والتي تتطلب منا الالتزام بالمتطلبات الأخلاقية وتخطيط المراجعة وتنفيذها للحصول على تأكيد معقول. وفي إطار المراجعة نمارس الحكم المهني ونحافظ على نزعة الشك المهني، كما نقوم بما يلي:','- تحديد وتقييم مخاطر التحريف الجوهري في القوائم المالية، سواء بسبب غش أو خطأ، وتصميم وتنفيذ إجراءات مراجعة تستجيب لتلك المخاطر، والحصول على أدلة كافية ومناسبة لتوفير أساس لرأينا. ويعد خطر عدم اكتشاف تحريف جوهري ناتج عن غش أعلى من الخطر الناتج عن خطأ، لأن الغش قد ينطوي على تواطؤ أو تزوير أو حذف متعمد أو إفادات مضللة أو تجاوز للرقابة الداخلية.','- الحصول على فهم للرقابة الداخلية ذات الصلة بالمراجعة لتصميم إجراءات مناسبة للظروف، وليس بغرض إبداء رأي في فعالية الرقابة الداخلية للشركة.','- تقييم مدى ملاءمة السياسات المحاسبية المستخدمة ومعقولية التقديرات المحاسبية والإفصاحات ذات العلاقة التي أعدتها الإدارة.','- استنتاج مدى ملاءمة استخدام الإدارة لأساس الاستمرارية المحاسبي، وما إذا كان هناك عدم تأكد جوهري يتعلق بأحداث أو ظروف قد تثير شكًا كبيرًا حول قدرة الشركة على الاستمرار.','- تقييم العرض العام للقوائم المالية وهيكلها ومحتواها بما في ذلك الإفصاحات، وما إذا كانت تعبر عن المعاملات والأحداث الأساسية بطريقة تحقق العرض العادل.','وبسبب القيود الملازمة للمراجعة، إلى جانب القيود الملازمة للرقابة الداخلية، هناك خطر لا يمكن تجنبه بأن بعض التحريفات الجوهرية قد لا تُكتشف، حتى وإن خُططت المراجعة ونُفذت بشكل سليم وفقًا للمعايير.','سنبلغكم كتابيًا بأي أوجه قصور مهمة في الرقابة الداخلية ذات صلة بمراجعة القوائم المالية نكتشفها خلال المراجعة (ISA 265).','{grp=1}بصفتنا مراجعي المجموعة، سنقوم بتوجيه أعمال مراجعي المكونات والإشراف عليها ومراجعتها وفقًا لمتطلبات مراجعة المجموعات (ISA 600)، وتلتزم الإدارة بإتاحة الوصول غير المقيد إلى معلومات المكونات وإدارتها ومراجعيها.','{ia=1}نعتزم الاستفادة من عمل إدارة المراجعة الداخلية في الحدود التي تسمح بها المعايير (ISA 610) بعد تقييم موضوعيتها وكفاءتها وتطبيقها لنهج منظم ومنضبط، وسنبقى مسؤولين وحدنا عن الرأي الذي نبديه.']],
['mgmt','مسؤوليات الإدارة وتحديد إطار التقرير المالي (Responsibilities of Management)',['ستتم المراجعة على أساس أن الإدارة، والمكلفين بالحوكمة حيثما كان ذلك مناسبًا، يقرون ويفهمون أنهم مسؤولون عن:','- إعداد القوائم المالية وعرضها بعدالة وفقًا لـ {{fw}}.','- الرقابة الداخلية التي تراها الإدارة ضرورية لتمكين إعداد قوائم مالية خالية من التحريف الجوهري، سواء بسبب غش أو خطأ.','- تزويدنا بما يلي: (أ) إمكانية الوصول إلى جميع المعلومات التي تعلم الإدارة أنها ذات صلة بإعداد القوائم المالية، مثل السجلات والمستندات وغيرها؛ (ب) أي معلومات إضافية قد نطلبها لغرض المراجعة؛ (ج) إمكانية الوصول غير المقيد إلى الأشخاص داخل المنشأة الذين نرى ضرورة الحصول على أدلة منهم.','- تقييم قدرة الشركة على الاستمرار والإفصاح عن الأمور المتعلقة بالاستمرارية واستخدام أساس الاستمرارية المحاسبي.','وكجزء من عملية المراجعة، سنطلب من الإدارة، والمكلفين بالحوكمة حيثما كان مناسبًا، إقرارات كتابية بشأن الإفادات التي قُدمت لنا فيما يتعلق بالمراجعة (ISA 580).','نتطلع إلى التعاون الكامل من موظفيكم خلال المراجعة.']],
['rep','التقرير (Reporting)',['سيكون تقريرنا وفقًا لـ ISA 700 وما يتصل به. وقد يلزم تعديل شكل ومحتوى تقريرنا في ضوء نتائج المراجعة (ISA 705 وISA 706)، كما قد نُدرج أمور المراجعة الرئيسية عند الاقتضاء (ISA 701).','{jur=EG}بالإضافة إلى ذلك، سنعد التقرير عن المتطلبات القانونية والتنظيمية الأخرى وفقًا لـ {{law}} (بحاجة لمراجعة مهني لتحديد المتطلبات المحلية النافذة).','{jur=SA}بالإضافة إلى ذلك، سنعد التقرير عن المتطلبات النظامية الأخرى وفقًا لـ {{law}} ومتطلبات الهيئة السعودية للمراجعين والمحاسبين (بحاجة لمراجعة مهني).','{jur=INT}كما سنعد التقرير عن أي متطلبات قانونية وتنظيمية أخرى تنطبق على الشركة وفقًا لـ {{law}}.']],
['plan','الجدول الزمني والفريق والأتعاب (Timetable, Team and Fees)',['يتولى {{partner}} مسؤولية الارتباط بصفته الشريك المسؤول. ونخطط لإنهاء أعمال المراجعة وإصدار تقريرنا في موعد أقصاه {{deadline}}، شريطة توفير المعلومات المطلوبة في المواعيد المتفق عليها.','تُحتسب أتعابنا على أساس الوقت الفعلي المستغرق ومستوى الخبرة المطلوب، وتقدر بمبلغ {{fees}} {{cur}} مضافًا إليها المصروفات النثرية والضرائب المقررة. وفي حال ظهور ظروف تستلزم عملًا إضافيًا جوهريًا سنبلغكم قبل البدء فيه.','{recur=1}يظل هذا الخطاب ساريًا للسنوات اللاحقة ما لم يُلغَ أو يُعدَّل أو يُستبدل (ISA 210).']],
['other','أحكام أخرى (Other Terms)',['- تظل أوراق العمل ملكًا للمكتب وتخضع لمتطلبات السرية والحفظ المهنية والنظامية.','- لن نتحمل أي مسؤولية عن الاعتماد على تقريرنا لأغراض غير التي أُعد من أجلها.','- تخضع الخلافات الناشئة عن هذا الخطاب لـ {{law}}.','- يُعد هذا الخطاب سريًا ولا يجوز الإفصاح عنه للغير إلا بموافقتنا أو بموجب القانون.']],
['sign','التوقيع والقبول (Signature and Acknowledgement)',['نرجو التكرم بالتوقيع على النسخة المرفقة من هذا الخطاب وإعادتها إلينا دلالة على علمكم وموافقتكم على ترتيبات مراجعتنا للقوائم المالية بما في ذلك مسؤولياتنا ومسؤولياتكم.','{{firm}}','{{partner}} — الشريك المسؤول','تم الاطلاع والموافقة نيابة عن شركة {{company}}:','الاسم: {{ceo}}          الصفة: ..................          التوقيع: ..................          التاريخ: ..................']]]});

['decl','الإقرار (Declaration)',['أقر أنا الموقع أدناه بأنني اطلعت على متطلبات الاستقلال الواردة في {{ethics}} وسياسات المكتب، وأنني:','- لا أمتلك أنا أو أفراد أسرتي المباشرون أي مصلحة مالية مباشرة أو غير مباشرة جوهرية في الشركة أو الجهات المرتبطة بها.','- لا تربطني بالشركة أو بإدارتها أو بالمكلفين بالحوكمة علاقة عمل أو علاقة أسرية أو شخصية وثيقة تشكل تهديدًا للاستقلال.','- لم أشغل خلال الفترة المشمولة أو الفترة الحالية منصبًا لدى الشركة يمكنني من التأثير على إعداد السجلات المحاسبية أو القوائم المالية.','- لم أقدم خدمات غير تأكيدية للشركة تتعارض مع متطلبات الاستقلال.','- لم أقبل هدايا أو ضيافة من الشركة تتجاوز الحد غير الجوهري.','- سأبلغ الشريك المسؤول فورًا بأي تغير في هذه الظروف خلال فترة الارتباط.']],

['scope','خصائص الارتباط والنطاق (Scope)',['إطار التقرير المالي: {{fw}} — متطلبات التقرير الإضافية: {{law}}.','المكونات والمواقع المشمولة ونطاق العمل لكل منها: ..................','{first=1}ارتباط أول: إجراءات الأرصدة الافتتاحية وفقًا لـ ISA 510، بما في ذلك مراجعة أوراق عمل المراجع السابق إن أمكن واختبار الأرصدة الافتتاحية الجوهرية.','{first=0}ارتباط متكرر: الاستفادة من فهم السنة السابقة مع تحديثه، ومتابعة الأمور المرحلة من السنة السابقة (ملاحظات الإدارة، التسويات غير المعدلة، أمور الإقفال).']],
['mat','الأهمية النسبية (Materiality)',['الأهمية النسبية الكلية: {{om}} {{cur}} — أهمية الأداء: {{pm}} {{cur}} — حد الضآلة الواضحة: {{ct}} {{cur}}.','المعيار المستخدم والنسبة ومبررات الاختيار موثقة في ورقة الأهمية النسبية (ISA 320). الأهمية النسبية الخاصة لفئات المعاملات أو الأرصدة أو الإفصاحات الحساسة (إن وجدت): ..................']],
['risk','المخاطر المقيمة (Assessed Risks)',['ملخص مخاطر التحريف الجوهري على مستوى القوائم المالية وعلى مستوى التأكيدات وفق مصفوفة تقييم المخاطر (ISA 315).','المخاطر المهمة (Significant Risks)، بما في ذلك الافتراض القابل للدحض لمخاطر الغش في الإيرادات وخطر تجاوز الإدارة للرقابة (ISA 240): ..................','المجالات ذات التقديرات المحاسبية المرتفعة عدم التأكد (ISA 540): ..................']],
['resp','الاستجابة العامة والنهج (Overall Responses)',['{ctrl=1}نهج مختلط: الاعتماد على الضوابط في الدورات التي تثبت فاعلية تصميمها وتنفيذها، مع اختبار فاعليتها التشغيلية (ISA 330)، وإجراءات أساسية للأرصدة الجوهرية.','{ctrl=0}نهج أساسي: إجراءات أساسية موسعة دون الاعتماد على الضوابط، مع إجراءات أساسية مستقلة لكل فئة جوهرية.','- تعيين أعضاء ذوي خبرة للمجالات عالية المخاطر وزيادة الإشراف.','- إدخال عنصر عدم القابلية للتنبؤ في اختيار الإجراءات وتوقيتها ومداها.','- اختبار قيود اليومية والتسويات اللاحقة للإقفال آليًا من بيانات المنشأة.']],
['team','الفريق والتوقيت والموارد (Team, Timing and Resources)',['الشريك المسؤول: {{partner}} — مدير الارتباط: .................. — أعضاء الفريق: ..................','الخبراء والمتخصصون (تقنية المعلومات، الضرائب والزكاة، التقييم، الاكتواري): ..................','مراجعة جودة الارتباط (EQR): مطلوبة / غير مطلوبة — المراجع المعين: ..................','الجدول الزمني: التخطيط .................. — الزيارة المرحلية .................. — الزيارة النهائية .................. — إصدار التقرير قبل {{deadline}}.']],
['comm','التواصل مع المكلفين بالحوكمة (ISA 260)',['سيتم إبلاغ {{tcwg}} بالنطاق والتوقيت المخطط والمخاطر المهمة المحددة قبل بدء الأعمال الميدانية، وبالنتائج المهمة عند الإقفال.']]]});

TPL.push({id:'legalconf',cat:'conf',ar:'خطاب الاستفسار من المستشار القانوني',en:'Legal Letter (Inquiry of Legal Counsel)',isa:'501',wp:'Q-01',desc:'الاتصال المباشر بالمستشار القانوني لتحديد الدعاوى والمطالبات وتقييم الإدارة لها.',

['body','',['يقوم مراجعو حساباتنا {{firm}} بمراجعة قوائمنا المالية عن السنة المنتهية في {{period}}. ونرجو أن تزودوهم مباشرة بالمعلومات التالية عن الدعاوى والمطالبات التي توليتموها أو أُبلغتم بها حتى تاريخ ردكم:','- وصف كل دعوى أو مطالبة ووضعها الحالي.','- تقييمكم لاحتمال النتيجة (مرجح، ممكن، مستبعد) وتقدير المبلغ المحتمل أو مداه.','- أي مطالبات محتملة لم تُرفع بعد تعلمون بها.','- أتعابكم غير المسددة إن وجدت.','يرجى الإفادة إذا كانت هناك أي قيود على ردكم.']],

TPL.push({id:'replet',cat:'mgmt',ar:'خطاب التمثيل (إقرارات الإدارة)',en:'Management Representation Letter',isa:'580',wp:'X-08',desc:'إقرارات كتابية من الإدارة بتاريخ تقرير المراجع: الإقرارات العامة والمحددة المطلوبة بموجب ISA 580 والمعايير الأخرى.',
opts:[['gc','عدم تأكد جوهري بشأن الاستمرارية',[['0','لا'],['1','نعم']],'0'],['grp','مجموعة',[['0','لا'],['1','نعم']],'0']],
secs:[['head','',['{{city}} في {{rdate}}','السادة/ {{firm}}','الموضوع: خطاب التمثيل بخصوص مراجعة القوائم المالية لشركة {{company}} عن السنة المنتهية في {{period}}']],
['intro','',['يُقدَّم هذا الخطاب فيما يتعلق بمراجعتكم للقوائم المالية لشركة {{company}} عن السنة المنتهية في {{period}} لغرض إبداء رأي عما إذا كانت القوائم المالية تعرض بعدالة، من جميع الجوانب الجوهرية، وفقًا لـ {{fw}}.','نؤكد، حسب أفضل علمنا واعتقادنا، وبعد إجراء الاستفسارات التي رأيناها ضرورية لأغراض إعلام أنفسنا على النحو المناسب، ما يلي:']],
['fs','القوائم المالية',['- وفينا بمسؤولياتنا الواردة في شروط ارتباط المراجعة عن إعداد القوائم المالية وفقًا لـ {{fw}}، وعلى وجه الخصوص فإنها تُعرض بعدالة وفقًا لهذا الإطار.','- الطرق والبيانات والافتراضات المهمة المستخدمة في إعداد التقديرات المحاسبية وإفصاحاتها ملائمة لتحقيق الاعتراف والقياس والإفصاح المعقول وفقًا للإطار (ISA 540).','- تمت المحاسبة عن العلاقات والمعاملات مع الأطراف ذات العلاقة والإفصاح عنها على نحو ملائم (ISA 550).','- جميع الأحداث اللاحقة لتاريخ القوائم المالية والتي يتطلب الإطار تعديلًا أو إفصاحًا بشأنها قد عُدلت أو أُفصح عنها (ISA 560).','- آثار التحريفات غير المصححة غير جوهرية، منفردة ومجتمعة، للقوائم المالية ككل. وقائمة التحريفات غير المصححة مرفقة بهذا الخطاب (ISA 450).','- تمت المحاسبة والإفصاح عن جميع الدعاوى والمطالبات الفعلية أو المحتملة وفقًا للإطار (ISA 501).']],
['info','المعلومات المقدمة',['- زودناكم بإمكانية الوصول إلى جميع المعلومات ذات الصلة بإعداد القوائم المالية كالسجلات والمستندات والأمور الأخرى، وبالمعلومات الإضافية التي طلبتموها، وبإمكانية الوصول غير المقيد إلى الأشخاص الذين رأيتم ضرورة الحصول على أدلة منهم.','- جميع المعاملات سُجلت في السجلات المحاسبية وانعكست في القوائم المالية.','- أفصحنا لكم عن نتائج تقييمنا لخطر أن تكون القوائم المالية محرفة جوهريًا نتيجة للغش (ISA 240).','- أفصحنا لكم عن جميع المعلومات المتعلقة بالغش أو الغش المشتبه به الذي نعلم به ويؤثر على المنشأة ويشمل الإدارة أو الموظفين ذوي الأدوار المهمة في الرقابة الداخلية أو آخرين إذا كان للغش أثر جوهري على القوائم المالية.','- أفصحنا لكم عن جميع المعلومات المتعلقة بادعاءات الغش أو الغش المشتبه به التي أبلغها موظفون أو موظفون سابقون أو محللون أو جهات رقابية أو غيرهم.','- أفصحنا لكم عن جميع حالات عدم الالتزام أو الاشتباه في عدم الالتزام بالقوانين واللوائح التي ينبغي مراعاة آثارها عند إعداد القوائم المالية (ISA 250).','- أفصحنا لكم عن هوية الأطراف ذات العلاقة بالمنشأة وجميع العلاقات والمعاملات معهم التي نعلم بها.','{gc=0}- ليس لدينا علم بأي أحداث أو ظروف قد تثير شكًا كبيرًا حول قدرة المنشأة على الاستمرار، وخططنا للعمل المستقبلي مجدية (ISA 570).','{gc=1}- أفصحنا لكم عن جميع الأحداث والظروف التي قد تثير شكًا كبيرًا حول قدرة المنشأة على الاستمرار وعن خططنا لمواجهتها، ونرى أنها مجدية وأن الإفصاح في القوائم المالية كافٍ (ISA 570).','{grp=1}- قدمنا لكم جميع المعلومات المتعلقة بمكونات المجموعة، ولا توجد قيود على وصولكم إلى معلومات المكونات وإدارتها ومراجعيها (ISA 600).']],
['other','إقرارات إضافية محددة',['- لا توجد خطط أو نوايا قد تؤثر جوهريًا على القيمة الدفترية أو تبويب الأصول والالتزامات.','- للمنشأة سند ملكية مُرضٍ لجميع الأصول، ولا توجد رهون أو أعباء عليها إلا ما أُفصح عنه.','- التزمنا بجميع جوانب الاتفاقيات التعاقدية التي قد يكون لعدم الالتزام بها أثر جوهري، بما في ذلك تعهدات القروض.','- إقرارات أخرى خاصة بهذا الارتباط: ..................']],
['sign','',['{{ceo}} — الرئيس التنفيذي          {{cfo}} — المدير المالي','المرفق: ملخص التحريفات غير المصححة.']]]});

TPL.push({id:'mgmtletter',cat:'mgmt',ar:'خطاب الإدارة (يُبنى آليًا من الملاحظات)',en:'Management Letter',isa:'265 260',wp:'X-10 C-11',auto:'ml',desc:'إبلاغ الإدارة والمكلفين بالحوكمة بأوجه القصور في الرقابة الداخلية والملاحظات الأخرى. تُولَّد النقاط آليًا من الملاحظات المسجلة والاستثناءات وقوائم الفحص والضوابط غير الفعالة وفروق الميزان، مع إمكانية التضمين والتحرير.',

secs:[['head','',['{{city}} في {{rdate}}','السادة/ {{tcwg}}','شركة {{company}}','الموضوع: خطاب الإدارة عن مراجعة القوائم المالية للسنة المنتهية في {{period}}']],
['intro','مقدمة (Introduction)',['في إطار مراجعتنا للقوائم المالية لشركة {{company}} عن السنة المنتهية في {{period}} وفقًا لـ {{stdname}}، أخذنا في الاعتبار الرقابة الداخلية ذات الصلة بإعداد القوائم المالية لغرض تصميم إجراءات مراجعة ملائمة للظروف، وليس لغرض إبداء رأي في فعالية الرقابة الداخلية.','نعرض فيما يلي أوجه القصور والملاحظات التي لفتت انتباهنا خلال المراجعة، مع توصياتنا وردود الإدارة. ولا تمثل هذه الملاحظات بالضرورة جميع أوجه القصور التي قد توجد، إذ تقتصر على ما تبين لنا أثناء أداء أعمال المراجعة.']],
['sum','ملخص الملاحظات (Summary)',['[[ML_SUMMARY]]']],
['pts','الملاحظات التفصيلية والتوصيات (Detailed Findings and Recommendations)',['[[ML_POINTS]]']],
['prior','متابعة ملاحظات السنة السابقة (Prior Year Follow-up)',['[[ML_PRIOR]]'],'prior=1'],
['close','الختام وقيود الاستخدام (Closing and Restriction on Use)',['أُعد هذا الخطاب لاستخدام الإدارة والمكلفين بالحوكمة فقط، ولا ينبغي استخدامه لأي غرض آخر أو إتاحته للغير دون موافقتنا الكتابية المسبقة.','نشكر الإدارة والموظفين على تعاونهم خلال المراجعة، ونحن على استعداد لمناقشة هذه الملاحظات.','{{firm}}','{{partner}} — الشريك المسؤول']]]});

['opU','الرأي (Opinion)',['لقد راجعنا القوائم المالية لشركة {{company}} ("الشركة")، والتي تشمل قائمة المركز المالي في {{period}}، وقائمة الأرباح أو الخسائر والدخل الشامل الآخر، وقائمة التغيرات في حقوق الملكية، وقائمة التدفقات النقدية للسنة المنتهية في ذلك التاريخ، والإيضاحات المتممة للقوائم المالية بما في ذلك ملخص للسياسات المحاسبية الهامة.','وفي رأينا، إن القوائم المالية المرفقة تعرض بعدالة، من جميع الجوانب الجوهرية، المركز المالي للشركة في {{period}} وأداءها المالي وتدفقاتها النقدية للسنة المنتهية في ذلك التاريخ وفقًا لـ {{fw}}.'],'op=U'],
['opQ','الرأي المتحفظ (Qualified Opinion)',['لقد راجعنا القوائم المالية لشركة {{company}} ("الشركة")، والتي تشمل قائمة المركز المالي في {{period}}، وقائمة الأرباح أو الخسائر والدخل الشامل الآخر، وقائمة التغيرات في حقوق الملكية، وقائمة التدفقات النقدية للسنة المنتهية في ذلك التاريخ، والإيضاحات المتممة للقوائم المالية بما في ذلك ملخص للسياسات المحاسبية الهامة.','{basis=M}وفي رأينا، باستثناء آثار الأمر الموضح في قسم «أساس الرأي المتحفظ» من تقريرنا، فإن القوائم المالية المرفقة تعرض بعدالة، من جميع الجوانب الجوهرية، المركز المالي للشركة في {{period}} وأداءها المالي وتدفقاتها النقدية للسنة المنتهية في ذلك التاريخ وفقًا لـ {{fw}}.','{basis=S}وفي رأينا، باستثناء الآثار المحتملة للأمر الموضح في قسم «أساس الرأي المتحفظ» من تقريرنا، فإن القوائم المالية المرفقة تعرض بعدالة، من جميع الجوانب الجوهرية، المركز المالي للشركة في {{period}} وأداءها المالي وتدفقاتها النقدية للسنة المنتهية في ذلك التاريخ وفقًا لـ {{fw}}.'],'op=Q'],
['opA','الرأي المعاكس (Adverse Opinion)',['لقد راجعنا القوائم المالية لشركة {{company}} ("الشركة")، والتي تشمل قائمة المركز المالي في {{period}}، وقائمة الأرباح أو الخسائر والدخل الشامل الآخر، وقائمة التغيرات في حقوق الملكية، وقائمة التدفقات النقدية للسنة المنتهية في ذلك التاريخ، والإيضاحات المتممة للقوائم المالية بما في ذلك ملخص للسياسات المحاسبية الهامة.','وفي رأينا، ونظرًا لأهمية الأمر الموضح في قسم «أساس الرأي المعاكس» من تقريرنا، فإن القوائم المالية المرفقة لا تعرض بعدالة المركز المالي للشركة في {{period}} ولا أداءها المالي ولا تدفقاتها النقدية للسنة المنتهية في ذلك التاريخ وفقًا لـ {{fw}}.'],'op=A'],
['opD','الامتناع عن إبداء الرأي (Disclaimer of Opinion)',['لقد كُلفنا بمراجعة القوائم المالية لشركة {{company}} ("الشركة")، والتي تشمل قائمة المركز المالي في {{period}}، وقائمة الأرباح أو الخسائر والدخل الشامل الآخر، وقائمة التغيرات في حقوق الملكية، وقائمة التدفقات النقدية للسنة المنتهية في ذلك التاريخ، والإيضاحات المتممة للقوائم المالية بما في ذلك ملخص للسياسات المحاسبية الهامة.','نحن لا نبدي رأيًا في القوائم المالية المرفقة للشركة. ونظرًا لأهمية الأمر الموضح في قسم «أساس الامتناع عن إبداء الرأي» من تقريرنا، لم نتمكن من الحصول على أدلة مراجعة كافية ومناسبة لتوفير أساس لرأي مراجعة في هذه القوائم المالية.'],'op=D'],
['basisU','أساس الرأي (Basis for Opinion)',['لقد قمنا بالمراجعة وفقًا لـ {{stdname}}. ومسؤولياتنا بموجب تلك المعايير موضحة بمزيد من التفصيل في قسم «مسؤوليات المراجع عن مراجعة القوائم المالية» من تقريرنا. ونحن مستقلون عن الشركة وفقًا لـ {{ethics}} ذات الصلة بمراجعتنا للقوائم المالية، وقد وفينا أيضًا بمسؤولياتنا الأخلاقية الأخرى وفقًا لتلك المتطلبات. ونعتقد أن أدلة المراجعة التي حصلنا عليها كافية ومناسبة لتوفير أساس لرأينا.'],'op=U'],
['basisQ','أساس الرأي المتحفظ (Basis for Qualified Opinion)',['{{qmatter}}','{basis=M}[صف التحريف وأثره المالي الكمي على البنود المتأثرة، أو اذكر سبب عدم إمكانية تحديده عمليًا.]','{basis=S}[صف الأمر الذي حال دون الحصول على أدلة كافية ومناسبة، والإجراءات البديلة التي جرت محاولتها.]','لقد قمنا بالمراجعة وفقًا لـ {{stdname}}. ومسؤولياتنا بموجب تلك المعايير موضحة في قسم «مسؤوليات المراجع عن مراجعة القوائم المالية» من تقريرنا. ونحن مستقلون عن الشركة وفقًا لـ {{ethics}}، وقد وفينا بمسؤولياتنا الأخلاقية الأخرى. ونعتقد أن أدلة المراجعة التي حصلنا عليها كافية ومناسبة لتوفير أساس لرأينا المتحفظ.'],'op=Q'],
['basisA','أساس الرأي المعاكس (Basis for Adverse Opinion)',['{{qmatter}}','[صف التحريف الجوهري والمنتشر وآثاره على القوائم المالية بشكل كمي حيثما أمكن.]','لقد قمنا بالمراجعة وفقًا لـ {{stdname}}. ومسؤولياتنا موضحة في قسم «مسؤوليات المراجع عن مراجعة القوائم المالية». ونحن مستقلون عن الشركة وفقًا لـ {{ethics}}، وقد وفينا بمسؤولياتنا الأخلاقية الأخرى. ونعتقد أن أدلة المراجعة التي حصلنا عليها كافية ومناسبة لتوفير أساس لرأينا المعاكس.'],'op=A'],
['basisD','أساس الامتناع عن إبداء الرأي (Basis for Disclaimer of Opinion)',['{{qmatter}}','[صف الأمر أو الأمور التي حالت دون الحصول على أدلة كافية ومناسبة، وآثارها المحتملة الجوهرية والمنتشرة.]'],'op=D'],
['gc','عدم تأكد جوهري يتعلق بالاستمرارية (Material Uncertainty Related to Going Concern)',['نلفت الانتباه إلى الإيضاح رقم ({{gcnote}}) من القوائم المالية الذي يشير إلى [الأحداث أو الظروف]. وتشير هذه الأحداث أو الظروف، إلى جانب الأمور الأخرى الواردة في الإيضاح، إلى وجود عدم تأكد جوهري قد يثير شكًا كبيرًا حول قدرة الشركة على الاستمرار. ورأينا غير معدل فيما يتعلق بهذا الأمر.'],'gc=1&op=U|Q'],
['eom','لفت انتباه (Emphasis of Matter)',['نلفت الانتباه إلى {{eomtext}}. ورأينا غير معدل فيما يتعلق بهذا الأمر.'],'eom=1&op!=D'],
['kam','أمور المراجعة الرئيسية (Key Audit Matters)',['أمور المراجعة الرئيسية هي تلك الأمور التي كانت، في تقديرنا المهني، الأكثر أهمية في مراجعتنا للقوائم المالية للفترة الحالية. وقد تمت معالجة هذه الأمور في سياق مراجعتنا للقوائم المالية ككل وعند تكوين رأينا فيها، ولا نبدي رأيًا منفصلًا في هذه الأمور.','{op=Q|A}بالإضافة إلى الأمر الموضح في قسم «أساس الرأي»، فقد حددنا الأمور الموضحة أدناه على أنها أمور المراجعة الرئيسية التي يجب الإبلاغ عنها في تقريرنا.','{gc=1}بالإضافة إلى الأمر الموضح في قسم «عدم تأكد جوهري يتعلق بالاستمرارية»، فقد حددنا الأمور الموضحة أدناه.','{{kamtext}}'],'op!=D&kam=1;listed=1&op!=D'],
['oi','المعلومات الأخرى (Other Information)',['الإدارة مسؤولة عن المعلومات الأخرى. وتشمل المعلومات الأخرى {{oidoc}} ولكنها لا تشمل القوائم المالية وتقرير المراجع عنها.','ولا يغطي رأينا في القوائم المالية المعلومات الأخرى، ولا نبدي أي شكل من أشكال استنتاج التأكيد بشأنها.','وفيما يتعلق بمراجعتنا للقوائم المالية، تتمثل مسؤوليتنا في قراءة المعلومات الأخرى، وعند القيام بذلك نأخذ في الاعتبار ما إذا كانت المعلومات الأخرى غير متسقة بشكل جوهري مع القوائم المالية أو مع المعرفة التي حصلنا عليها أثناء المراجعة، أو يبدو أنها محرفة بشكل جوهري بطريقة أخرى. وإذا استنتجنا، بناءً على العمل الذي قمنا به، وجود تحريف جوهري في هذه المعلومات الأخرى، فإنه يتعين علينا الإبلاغ عن تلك الحقيقة.','{op=U}ليس لدينا ما نبلغ عنه في هذا الشأن.','{op=Q|A}وكما هو موضح في قسم «أساس الرأي» أعلاه، [صف أثر الأمر المسبب للتعديل على المعلومات الأخرى].'],'oi=1&op!=D'],
['om','أمور أخرى (Other Matter)',['{{omtext}}'],'om=1'],
['mgmt','مسؤوليات الإدارة والمكلفين بالحوكمة عن القوائم المالية',['الإدارة هي المسؤولة عن إعداد القوائم المالية وعرضها بعدالة وفقًا لـ {{fw}}، وعن الرقابة الداخلية التي تراها ضرورية لتمكينها من إعداد قوائم مالية خالية من التحريف الجوهري، سواء بسبب غش أو خطأ.','وعند إعداد القوائم المالية، تكون الإدارة مسؤولة عن تقييم قدرة الشركة على الاستمرار والإفصاح، بحسب مقتضى الحال، عن الأمور ذات العلاقة بالاستمرارية واستخدام أساس الاستمرارية المحاسبي، ما لم تكن هناك نية لدى الإدارة لتصفية الشركة أو إيقاف عملياتها، أو ليس لديها بديل واقعي سوى القيام بذلك.','والمكلفون بالحوكمة هم المسؤولون عن الإشراف على آلية التقرير المالي في الشركة.']],
['audU','مسؤوليات المراجع عن مراجعة القوائم المالية',['تتمثل أهدافنا في الحصول على تأكيد معقول عما إذا كانت القوائم المالية ككل خالية من التحريف الجوهري، سواء بسبب غش أو خطأ، وإصدار تقرير المراجع الذي يتضمن رأينا. والتأكيد المعقول هو مستوى عالٍ من التأكيد، ولكنه ليس ضمانًا على أن المراجعة التي يتم القيام بها وفقًا لـ {{stdname}} ستكشف دائمًا عن التحريف الجوهري عند وجوده. ويمكن أن تنشأ التحريفات عن غش أو خطأ، وتُعد جوهرية إذا كان من المتوقع بشكل معقول أن تؤثر، منفردة أو في مجملها، على القرارات الاقتصادية التي يتخذها المستخدمون على أساس هذه القوائم المالية.','وكجزء من المراجعة وفقًا لـ {{stdname}}، فإننا نمارس الحكم المهني ونحافظ على نزعة الشك المهني خلال المراجعة. وعلينا أيضًا:','- تحديد وتقييم مخاطر التحريف الجوهري في القوائم المالية، سواء بسبب غش أو خطأ، وتصميم وتنفيذ إجراءات مراجعة استجابة لتلك المخاطر، والحصول على أدلة مراجعة كافية ومناسبة لتوفير أساس لرأينا. ويعد خطر عدم اكتشاف تحريف جوهري ناتج عن غش أعلى من الخطر الناتج عن خطأ، لأن الغش قد ينطوي على تواطؤ أو تزوير أو حذف متعمد أو إفادات مضللة أو تجاوز للرقابة الداخلية.','- الحصول على فهم للرقابة الداخلية ذات الصلة بالمراجعة، من أجل تصميم إجراءات مراجعة مناسبة للظروف، وليس بغرض إبداء رأي في فعالية الرقابة الداخلية للشركة.','- تقييم مدى مناسبة السياسات المحاسبية المستخدمة ومدى معقولية التقديرات المحاسبية والإفصاحات ذات العلاقة التي قامت بها الإدارة.','- استنتاج مدى مناسبة استخدام الإدارة لأساس الاستمرارية المحاسبي، واستنادًا إلى أدلة المراجعة التي تم الحصول عليها، ما إذا كان هناك عدم تأكد جوهري يتعلق بأحداث أو ظروف قد تثير شكًا كبيرًا حول قدرة الشركة على الاستمرار. وإذا خلصنا إلى وجود عدم تأكد جوهري، يتعين علينا أن نلفت الانتباه في تقريرنا إلى الإفصاحات ذات العلاقة في القوائم المالية، أو تعديل رأينا إذا كانت تلك الإفصاحات غير كافية. وتستند استنتاجاتنا إلى أدلة المراجعة التي تم الحصول عليها حتى تاريخ تقريرنا. ومع ذلك، فإن الأحداث أو الظروف المستقبلية قد تتسبب في توقف الشركة عن الاستمرار.','- تقييم العرض العام للقوائم المالية وهيكلها ومحتواها، بما في ذلك الإفصاحات، وما إذا كانت القوائم المالية تعبر عن المعاملات والأحداث الأساسية بطريقة تحقق عرضًا عادلًا.','ونتواصل مع المكلفين بالحوكمة فيما يتعلق، من بين أمور أخرى، بالنطاق والتوقيت المخطط للمراجعة والنتائج المهمة للمراجعة، بما في ذلك أي أوجه قصور مهمة في الرقابة الداخلية نكتشفها أثناء مراجعتنا.','{listed=1}ونقدم أيضًا للمكلفين بالحوكمة بيانًا بأننا التزمنا بالمتطلبات الأخلاقية ذات الصلة المتعلقة بالاستقلال، ونبلغهم بجميع العلاقات والأمور الأخرى التي قد يُعتقد بشكل معقول أنها تؤثر على استقلالنا، والإجراءات المتخذة للقضاء على التهديدات أو الضمانات المطبقة، بحسب مقتضى الحال.','{listed=1;kam=1}ومن بين الأمور التي تم إبلاغها للمكلفين بالحوكمة، نحدد تلك الأمور التي كانت لها الأهمية القصوى عند مراجعة القوائم المالية للفترة الحالية، وبالتالي تُعد أمور المراجعة الرئيسية. ونصف هذه الأمور في تقريرنا ما لم يمنع نظام أو لائحة الإفصاح العلني عن الأمر، أو عندما نقرر، في ظروف نادرة للغاية، أن الأمر لا ينبغي الإبلاغ عنه في تقريرنا لأنه من المتوقع بشكل معقول أن تفوق العواقب السلبية لفعل ذلك فوائد المصلحة العامة من هذا الإبلاغ.'],'op!=D'],
['audD','مسؤوليات المراجع عن مراجعة القوائم المالية',['تتمثل مسؤوليتنا في القيام بمراجعة القوائم المالية للشركة وفقًا لـ {{stdname}} وإصدار تقرير المراجع. ومع ذلك، وبسبب الأمر الموضح في قسم «أساس الامتناع عن إبداء الرأي» من تقريرنا، لم نتمكن من الحصول على أدلة مراجعة كافية ومناسبة لتوفير أساس لرأي مراجعة في هذه القوائم المالية.','ونحن مستقلون عن الشركة وفقًا لـ {{ethics}}، وقد وفينا بمسؤولياتنا الأخلاقية الأخرى وفقًا لتلك المتطلبات.'],'op=D'],
['legal','التقرير عن المتطلبات القانونية والتنظيمية الأخرى',['{jur=EG}[المتطلبات وفقًا لـ {{law}}: مثل مدى إمساك الشركة لحسابات مالية منتظمة، واتفاق البيانات المالية الواردة بتقرير مجلس الإدارة مع ما هو وارد بدفاتر الشركة، وما يتطلبه القانون من بيانات — بحاجة لمراجعة مهني لمطابقة النص النظامي النافذ.]','{jur=SA}[المتطلبات وفقًا لـ {{law}} ومتطلبات الهيئة السعودية للمراجعين والمحاسبين ونظام الشركات — بحاجة لمراجعة مهني لمطابقة النص النظامي النافذ.]','{jur=INT}[حسب متطلبات {{law}} في الاختصاص المعني.]'],'legal=1'],
['sign','',['{listed=1}الشريك المسؤول عن ارتباط المراجعة الذي نتج عنه تقرير المراجع المستقل هذا هو {{partner}}.','{{firm}}','{{partner}}','{{firmaddr}} — {{city}}','{{rdate}}']]]});

TPL.push({id:'reviewrep',cat:'rep',ar:'تقرير الفحص المحدود للقوائم المالية',en:'Review Report',isa:'ISRE 2400 ISRE 2410',wp:'',desc:'تقرير استنتاج فحص محدود (تأكيد محدود) على قوائم مالية سنوية (ISRE 2400) أو معلومات مالية أولية من قبل مراجع المنشأة (ISRE 2410).',
opts:[['std','المعيار',[['2400','ISRE 2400 (ممارس ليس مراجع المنشأة)'],['2410','ISRE 2410 (مراجع المنشأة — معلومات أولية)']],'2410'],['concl','الاستنتاج',[['U','غير معدل'],['Q','متحفظ'],['A','معاكس'],['D','امتناع']],'U']],
secs:[['title','',['تقرير الفحص المحدود','إلى السادة/ {{addr}} — شركة {{company}}']],
['intro','مقدمة',['لقد قمنا بالفحص المحدود لـ {std=2410}المعلومات المالية الأولية المختصرة{std=2400}القوائم المالية{/} المرفقة لشركة {{company}} عن الفترة المنتهية في {{period}}. والإدارة مسؤولة عن إعداد هذه المعلومات وعرضها وفقًا لـ {{fw}}. وتنحصر مسؤوليتنا في إبداء استنتاج على هذه المعلومات بناءً على فحصنا المحدود.']],
['scope','نطاق الفحص المحدود',['لقد قمنا بالفحص المحدود وفقًا للمعيار الدولي لارتباطات الفحص المحدود {std=2410}ISRE 2410 «الفحص المحدود للمعلومات المالية الأولية التي يؤديها المراجع المستقل للمنشأة»{std=2400}ISRE 2400 (المعدل) «ارتباطات الفحص المحدود للقوائم المالية التاريخية»{/}. ويتكون الفحص المحدود بصفة أساسية من الاستفسار من الموظفين المسؤولين عن الأمور المالية والمحاسبية، وتطبيق إجراءات تحليلية وإجراءات فحص محدود أخرى. ويقل نطاق الفحص المحدود جوهريًا عن نطاق المراجعة وفقًا للمعايير الدولية للمراجعة، وبالتالي لا يمكننا من الحصول على تأكيد بأننا سنصبح على دراية بجميع الأمور المهمة التي قد يتم تحديدها في المراجعة. ولذلك فإننا لا نبدي رأي مراجعة.']],
['cc','الاستنتاج',['{concl=U}استنادًا إلى فحصنا المحدود، لم يسترعِ انتباهنا ما يجعلنا نعتقد أن المعلومات المرفقة لم تُعد، من جميع الجوانب الجوهرية، وفقًا لـ {{fw}}.','{concl=Q}استنادًا إلى فحصنا المحدود، وباستثناء [آثار] الأمر الموضح في فقرة أساس الاستنتاج المتحفظ، لم يسترعِ انتباهنا ما يجعلنا نعتقد أن المعلومات المرفقة لم تُعد، من جميع الجوانب الجوهرية، وفقًا لـ {{fw}}.','{concl=A}استنادًا إلى فحصنا المحدود، ونظرًا لأهمية الأمر الموضح في فقرة أساس الاستنتاج المعاكس، فإن المعلومات المرفقة لم تُعد، من جميع الجوانب الجوهرية، وفقًا لـ {{fw}}.','{concl=D}نظرًا لأهمية الأمر الموضح في فقرة أساس الامتناع، لم نتمكن من إتمام الفحص المحدود، وعليه فإننا لا نبدي استنتاجًا على المعلومات المرفقة.']],
['sign','',['{{firm}} — {{partner}} — {{city}} — {{rdate}}']]]});

['purpose','الغرض من التقرير وقيود الاستخدام',['تقريرنا مقصور على الغرض المبين فيه، وهو مساعدة {{party}} في [الغرض] فيما يتعلق بـ {{subject}}، وقد لا يكون مناسبًا لأي غرض آخر.']],

TPL.push({id:'comprep',cat:'rep',ar:'تقرير التجميع',en:'Compilation Report',isa:'ISRS 4410',wp:'',desc:'تقرير المحاسب على تجميع المعلومات المالية (ISRS 4410 المعدل) دون تأكيد.',
secs:[['title','',['تقرير المحاسب عن التجميع','إلى السادة/ إدارة شركة {{company}}']],
['body','',['لقد قمنا بتجميع القوائم المالية المرفقة لشركة {{company}} بناءً على المعلومات التي قدمتموها، والتي تشمل [القوائم] عن السنة المنتهية في {{period}} وفقًا لـ {{fw}}.','لقد قمنا بهذا الارتباط وفقًا للمعيار الدولي للخدمات ذات العلاقة ISRS 4410 (المعدل). واستخدمنا خبرتنا في المحاسبة والتقرير المالي لمساعدتكم في إعداد وعرض هذه القوائم المالية. والتزمنا بالمتطلبات الأخلاقية ذات الصلة بما فيها مبادئ النزاهة والموضوعية والكفاءة المهنية والعناية الواجبة.','هذه القوائم المالية ودقة واكتمال المعلومات المستخدمة لتجميعها مسؤوليتكم.','ولما كان ارتباط التجميع ليس ارتباط تأكيد، فإننا غير مطالبين بالتحقق من دقة أو اكتمال المعلومات المقدمة إلينا، وعليه فإننا لا نبدي رأي مراجعة أو استنتاج فحص محدود.']],
['sign','',['{{firm}} — {{city}} — {{rdate}}']]]});

['cc','الرأي / الاستنتاج',['{lvl=R}في رأينا، إن {{subject}} مُعد، من جميع الجوانب الجوهرية، وفقًا لـ {{crit}}.','{lvl=L}استنادًا إلى الإجراءات المنفذة والأدلة التي حصلنا عليها، لم يسترعِ انتباهنا ما يجعلنا نعتقد أن {{subject}} لم يُعد، من جميع الجوانب الجوهرية، وفقًا لـ {{crit}}.']],

  async list(dir){dir=norm(dir);const pre=dir?dir+'/':'';const keys=await run('readonly',(s,set)=>{const g=s.getAllKeys(IDBKeyRange.bound(pre,pre+'￿'));g.onsuccess=()=>set(g.result)});
   const m=new Map();for(const k of keys){const rest=k.slice(pre.length);if(!rest)continue;const i=rest.indexOf('/');if(i<0){if(rest!=='.keep')m.set(rest,'file')}else m.set(rest.slice(0,i),'directory')}return [...m].map(([name,kind])=>({name,kind}))},
  mkdir:dir=>run('readwrite',s=>{s.put({p:norm(dir)+'/.keep',d:'',m:Date.now(),s:0})}),
  remove:p=>run('readwrite',s=>{p=norm(p);s.delete(p);s.delete(IDBKeyRange.bound(p+'/',p+'/￿'))}),
  async wipe(){await run('readwrite',s=>{s.clear()})}};}

/* ---------- Storage backend B: a real folder chosen by the user (File System Access API) ----------
   Safe write: createWritable() writes into a temporary swap file and replaces the target atomically
   only when close() succeeds; on error abort() discards the temp file and the original stays intact. */
function FSFS(root){const parts=p=>String(p).split('/').filter(Boolean);
 const nf=e=>e&&(e.name==='NotFoundError'||e.name==='TypeMismatchError'||e.name==='NotFoundErr');
 async function dir(ps,create){let d=root;for(const n of ps)d=await d.getDirectoryHandle(n,{create});return d}
 async function fh(p,create){const ps=parts(p);const name=ps.pop();const d=await dir(ps,create);return d.getFileHandle(name,{create})}
 async function writeBlob(p,b){const h=await fh(p,true);const w=await h.createWritable();try{await w.write(b);await w.close()}catch(e){try{await w.abort()}catch(_){/* abort after a failed write; the original error is re-thrown (intentional) */}throw e}}
 return{kind:'fs',root,label:root.name,
  async readText(p){try{return await (await (await fh(p,false)).getFile()).text()}catch(e){if(nf(e))return null;throw e}},
  async readBlob(p){try{return await (await fh(p,false)).getFile()}catch(e){if(nf(e))return null;throw e}},
  writeText:(p,txt)=>writeBlob(p,new Blob([String(txt)],{type:'application/json'})),
  writeBlob,
  async appendText(p,txt){const h=await fh(p,true);const f=await h.getFile();const w=await h.createWritable({keepExistingData:true});try{await w.write({type:'write',position:f.size,data:txt});await w.close()}catch(e){try{await w.abort()}catch(_){/* abort after a failed write; the original error is re-thrown (intentional) */}throw e}},
  async stat(p){try{const f=await (await fh(p,false)).getFile();return{size:f.size,mtime:f.lastModified}}catch(e){if(nf(e))return null;throw e}},
  async list(p){let d;try{d=await dir(parts(p),false)}catch(e){if(nf(e))return[];throw e}const out=[];for await(const [name,h] of d.entries()){if(name.endsWith('.crswap')||name==='.keep')continue;out.push({name,kind:h.kind})}return out},
  mkdir:async p=>{await dir(parts(p),true)},
  async remove(p){const ps=parts(p);const name=ps.pop();try{const d=await dir(ps,false);await d.removeEntry(name,{recursive:true})}catch(e){if(!nf(e))throw e}}};}

const FSA_OK=typeof window.showDirectoryPicker==='function';
async function copyTree(src,dst,path,progress,opts){opts=opts||{};let n=0;const items=await src.list(path);
 for(const it of items){const p=path?path+'/'+it.name:it.name;
  if(it.kind==='directory'){await dst.mkdir(p);n+=await copyTree(src,dst,p,progress,opts)}
  else{if(opts.skipExisting&&await dst.stat(p)){
     if(/\/_ops\/[^/]+\.jsonl$/.test('/'+p)){/* union of op lines – LWW makes duplicates harmless */const a=await src.readText(p)||'',b=await dst.readText(p)||'';const have=new Set(b.split('\n'));const add=a.split('\n').filter(l=>l&&!have.has(l));if(add.length)await dst.appendText(p,add.join('\n')+'\n')}
     continue}
   const b=await src.readBlob(p);if(b){await dst.writeBlob(p,b);n++;progress&&progress(n,p)}}}
 return n}
async function countFiles(fs,path){let n=0;for(const it of await fs.list(path)){const p=path?path+'/'+it.name:it.name;n+=it.kind==='directory'?await countFiles(fs,p):1}return n}

/* ================= a2 · Users & authentication (Web Crypto only) =================
 _users/users.json:
  uSalt  : global salt for the username lookup fingerprint (PBKDF2-SHA256, 100k)
  users[]: uh   = username fingerprint (for matching at login)
           name = username encrypted (AES-GCM-256) with the directory key DK
           disp = display name encrypted with DK
           pSalt/pHash = password verifier: SHA-256 of the first half of PBKDF2-SHA256(310k, 512 bits)
           wDK  = DK encrypted with a key derived from the second half (each user unwraps DK at login)
   No password or username is ever stored in clear text. */
const ENC=new TextEncoder(),DEC=new TextDecoder();
const KDF_IT=310000,UH_IT=100000;
const ROLES=['admin','partner','eqr','reviewer','assistant','viewer'];
const normU=u=>String(u||'').normalize('NFKC').trim().toLowerCase();
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function pbkdf2(pw,salt,it,bits){const k=await crypto.subtle.importKey('raw',ENC.encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},k,bits))}
const sha256=async b=>new Uint8Array(await crypto.subtle.digest('SHA-256',b));
const aesKey=(raw,ext)=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},!!ext,['encrypt','decrypt']);
async function encBytes(key,bytes){const iv=rnd(12);return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes))}}
async function decBytes(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)))}
const encStr=(k,s)=>encBytes(k,ENC.encode(String(s)));
const decStr=async(k,o)=>DEC.decode(await decBytes(k,o));
async function userHash(u,uSalt){return b64(await pbkdf2(normU(u),unb64(uSalt),UH_IT,256))}
async function passDerive(pw,salt){const bits=await pbkdf2(pw,salt,KDF_IT,512);return{verifier:b64(await sha256(bits.slice(0,32))),kek:await aesKey(bits.slice(32),false)}}
function ctEq(a,b){a=String(a);b=String(b);if(a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0}
const pvOf=async rec=>b64(await sha256(ENC.encode(rec.pSalt+'|'+rec.pHash))).slice(0,22);
function pwPolicy(pw){if(String(pw).length<8)return 'كلمة المرور يجب ألا تقل عن 8 أحرف.';if(!/[A-Za-z؀-ۿ]/.test(pw)||!/\d/.test(pw))return 'كلمة المرور يجب أن تحتوي على حروف وأرقام.';return ''}

let SESSION=null;           /* {id, role, display, username, dk(CryptoKey), dkRaw(Uint8Array), pv} */
const USERS={doc:null,mtime:0,names:{},logins:{},
 async load(){const txt=await STORE.readText('_users/users.json');let d=null;if(txt){try{d=JSON.parse(txt)}catch(e){throw new Error('ملف المستخدمين تالف: _users/users.json')}}
  if(d&&(!Array.isArray(d.users)||typeof d.uSalt!=='string'))throw new Error('بنية ملف المستخدمين غير صحيحة');
  this.doc=d;const st=await STORE.stat('_users/users.json');this.mtime=st?st.mtime:0;return d},
 async write(doc){doc.updatedAt=localISO();await withRetry(()=>STORE.writeText('_users/users.json',JSON.stringify(doc,null,1)));this.doc=doc;const st=await STORE.stat('_users/users.json');this.mtime=st?st.mtime:0},
 /* read-modify-write: always re-read the latest file before changing it (another admin may have edited it) */
 async mutate(fn){const d=await this.load();if(!d)throw new Error('لا يوجد ملف مستخدمين');await fn(d);await this.write(d);await this.decryptAll()},
 active(){return this.doc?this.doc.users.filter(u=>u.active!==false):[]},
 async decryptAll(){this.names={};this.logins={};if(!SESSION||!this.doc)return;for(const u of this.doc.users){try{this.names[u.id]=await decStr(SESSION.dk,u.disp);this.logins[u.id]=await decStr(SESSION.dk,u.name)}catch(e){this.names[u.id]='؟'}}},
 nameOf(id){return this.names[id]||(id?String(id).slice(0,8):'')}};

async function makeUserRecord(dkRaw,uSalt,{username,display,password,role},by){const pSalt=rnd(16);const {verifier,kek}=await passDerive(password,pSalt);const dk=await aesKey(dkRaw,false);
 const rec={id:uid('u_'),uh:await userHash(username,uSalt),pSalt:b64(pSalt),pHash:verifier,wDK:await encBytes(kek,dkRaw),name:await encStr(dk,normU(username)),disp:await encStr(dk,display||username),role:ROLES.includes(role)?role:'assistant',active:true,created:localISO(),createdBy:by||null};
 rec.pv=await pvOf(rec);return rec}

async function setupFirstAdmin({username,display,password}){const dkRaw=rnd(32);const uSalt=b64(rnd(16));
 const rec=await makeUserRecord(dkRaw,uSalt,{username,display,password,role:'admin'},null);
 const doc={format:'MEAP-users',version:1,kdf:{name:'PBKDF2',hash:'SHA-256',iterations:KDF_IT,usernameIterations:UH_IT,cipher:'AES-GCM-256'},uSalt,users:[rec],createdAt:localISO()};
 const existing=await USERS.load();if(existing&&existing.users.length)throw new Error('يوجد مستخدمون بالفعل في هذا المجلد. سجّل الدخول.');
 await USERS.write(doc);return login(username,password)}

const LOGIN_FAILS={get:()=>LS.get('meap.fails',{n:0,t:0}),set:v=>LS.set('meap.fails',v)};
async function login(username,password){const f=LOGIN_FAILS.get();if(f.n>=5&&Date.now()-f.t<30000)throw new Error('محاولات كثيرة. انتظر 30 ثانية ثم أعد المحاولة.');
 const doc=await USERS.load();if(!doc)throw new Error('لا يوجد مستخدمون بعد.');
 const uh=await userHash(username,doc.uSalt);const rec=doc.users.find(u=>ctEq(u.uh,uh)&&u.active!==false);
 const fail=()=>{LOGIN_FAILS.set({n:f.n+1,t:Date.now()});return new Error('اسم المستخدم أو كلمة المرور غير صحيحة.')};
 if(!rec){await passDerive(password,rnd(16));throw fail()}
 const {verifier,kek}=await passDerive(password,unb64(rec.pSalt));if(!ctEq(verifier,rec.pHash))throw fail();
 const dkRaw=await decBytes(kek,rec.wDK);LOGIN_FAILS.set({n:0,t:0});
 await startSession(rec,dkRaw,true);return SESSION}

async function startSession(rec,dkRaw,persist){const dk=await aesKey(dkRaw,false);
 SESSION={id:rec.id,role:rec.role,pv:rec.pv||await pvOf(rec),dk,dkRaw};await USERS.decryptAll();SESSION.display=USERS.nameOf(rec.id);SESSION.username=USERS.logins[rec.id]||'';
 /* Persistent sign-in: kept on this device until the user presses "Sign out". No idle or time-based expiry. */
 if(persist)await KV.set('session:'+STORE_ID,{id:rec.id,pv:SESSION.pv,dk:b64(dkRaw),at:localISO()})}

async function restoreSession(){const s=await KV.get('session:'+STORE_ID);if(!s)return null;const doc=USERS.doc||await USERS.load();if(!doc)return null;
 const rec=doc.users.find(u=>u.id===s.id&&u.active!==false);if(!rec||!ctEq(await pvOf(rec),s.pv)){await KV.del('session:'+STORE_ID);return null}
 await startSession(rec,unb64(s.dk),false);return SESSION}

/* Called on every sync tick: a deleted/deactivated user or a changed password ends the session */
async function checkSession(){if(!SESSION)return true;const st=await STORE.stat('_users/users.json');if(st&&st.mtime===USERS.mtime)return true;
 await USERS.load();const rec=USERS.doc&&USERS.doc.users.find(u=>u.id===SESSION.id&&u.active!==false);
 if(!rec||!ctEq(await pvOf(rec),SESSION.pv)){await KV.del('session:'+STORE_ID);return false}
 SESSION.role=rec.role;await USERS.decryptAll();SESSION.display=USERS.nameOf(rec.id);return true}

async function logout(){try{await SAVER.flush(true)}catch(e){logErr('a2_auth:75 await SAVER.flush(true)',e)}
 if(SAVER.q.length&&!(await ask({title:'تغييرات لم تُحفظ',body:'تعذّر حفظ بعض التغييرات. ستبقى في ذاكرة الجهاز وتُحفظ عند الدخول التالي. هل تريد الخروج؟',ok:'خروج',danger:true})))return;
 try{await presenceLeave()}catch(e){logErr('a2_auth:77 await presenceLeave()',e)}
 await KV.del('session:'+STORE_ID);SESSION=null;location.hash='#/';location.reload()}

async function addUser(o){const e=pwPolicy(o.password);if(e)throw new Error(e);
 await USERS.mutate(async d=>{const uh=await userHash(o.username,d.uSalt);if(d.users.some(u=>ctEq(u.uh,uh)))throw new Error('اسم المستخدم مستخدم بالفعل.');d.users.push(await makeUserRecord(SESSION.dkRaw,d.uSalt,o,SESSION.id))})}
async function setPassword(id,pw){const e=pwPolicy(pw);if(e)throw new Error(e);
 await USERS.mutate(async d=>{const r=d.users.find(u=>u.id===id);if(!r)throw new Error('المستخدم غير موجود');const pSalt=rnd(16);const {verifier,kek}=await passDerive(pw,pSalt);
  r.pSalt=b64(pSalt);r.pHash=verifier;r.wDK=await encBytes(kek,SESSION.dkRaw);r.pv=await pvOf(r);r.updated=localISO();r.updatedBy=SESSION.id;
  if(id===SESSION.id){SESSION.pv=r.pv;await KV.set('session:'+STORE_ID,{id,pv:r.pv,dk:b64(SESSION.dkRaw),at:localISO()})}})}
async function updateUser(id,{display,role,active}){await USERS.mutate(async d=>{const r=d.users.find(u=>u.id===id);if(!r)throw new Error('المستخدم غير موجود');
 if(role&&role!==r.role||active===false){const admins=d.users.filter(u=>u.role==='admin'&&u.active!==false&&u.id!==id);if(r.role==='admin'&&!admins.length)throw new Error('لا يمكن إزالة آخر مدير.')}

async function deleteUser(id){if(id===SESSION.id)throw new Error('لا يمكنك حذف حسابك الحالي.');

/* ---------- Migration v2 → v3 (schema 3, app 3.0.0) ----------
   Non-destructive and idempotent: first a verified backup of every text/JSON file outside _ops/attachments, then
   only additive changes. Op logs, attachments and folder names are never touched; v2 keys keep their meaning. */
async function sha256Hex(data){const buf=typeof data==='string'?new TextEncoder().encode(data):data instanceof Blob?await data.arrayBuffer():data;const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h),b=>b.toString(16).padStart(2,'0')).join('')}
async function migrateStore(s){const from=s.schema||2,stamp=localISO().replace(/[:T]/g,'-').slice(0,19),bdir='_backups/pre-v3-'+stamp;const files=[];
 const walk=async p=>{for(const it of await STORE.list(p)){const q=p?p+'/'+it.name:it.name;if(it.kind==='directory'){if(/^(_backups|_presence)$/.test(it.name)||it.name==='attachments'||it.name==='_ops')continue;await walk(q)}else if(/\.(json|jsonl)$/i.test(it.name))files.push(q)}};
 await walk('');const manifest={format:'MEAP-backup',version:1,kind:'pre-migration',from,to:SCHEMA,createdAt:localISO(),files:[]};
 for(const f of files){const txt=await STORE.readText(f);if(txt==null)continue;await withRetry(()=>STORE.writeText(bdir+'/'+f,txt));const back=await STORE.readText(bdir+'/'+f);const h=await sha256Hex(txt);if(back==null||await sha256Hex(back)!==h)throw new Error('تعذر التحقق من النسخة الاحتياطية قبل الترحيل: '+f);manifest.files.push({path:f,size:txt.length,sha256:h})}

 await STORE.appendText('_audit/system.jsonl',JSON.stringify({k:'sys.migrate',v:{from,to:SCHEMA,backup:bdir,files:manifest.files.length},t:Date.now(),u:'system'})+'\n');
 MIGRATED={from,to:SCHEMA,backup:bdir,files:manifest.files.length};return n}

/* ---------- Engagement store: per-user op logs merged with last-writer-wins ----------
   Each user/device appends its own operations to _ops/<user>__<device>.jsonl (no two writers share a file),
   readers merge every log by (time, user, seq). Human-readable snapshots (engagement.json, working-papers/…/data.json,
   links.json, findings/*.json …) are regenerated from the merged state after every save. */
let SEQ=0;
const cmpOp=(a,b)=>(a.t-b.t)||(a.u<b.u?-1:a.u>b.u?1:0)||((a.s||0)-(b.s||0));
class EngStore{
 constructor(path,meta){this.path=path;this.meta=meta||{};this.ver=0;this.map=new Map();this.files={};this.mine=new Map();this.seen=new Set()}
 async load(){await STORE.mkdir(this.path+'/_ops');await this.pull();for(const w of WAL.all())if(w.p===this.path)this.apply(w.o);return this}
 apply(op){if(!op||typeof op.k!=='string'||typeof op.t!=='number')return false;const cur=this.map.get(op.k);if(cur&&cmpOp(cur,op)>=0)return false;this.map.set(op.k,{v:op.v===undefined?null:op.v,t:op.t,u:op.u,s:op.s||0});this.ver++;return true}
 async pull(){const files=(await STORE.list(this.path+'/_ops')).filter(f=>f.kind==='file'&&f.name.endsWith('.jsonl'));const changed=[],older=[];
  for(const f of files){const p=this.path+'/_ops/'+f.name;const st=await STORE.stat(p);if(!st)continue;const rec=this.files[f.name];if(rec&&rec.size===st.size)continue;
   const txt=await STORE.readText(p)||'';this.files[f.name]={size:st.size};
   for(const line of txt.split('\n')){if(!line)continue;let op;try{op=JSON.parse(line)}catch(e){continue}
    if(this.apply(op))changed.push(op);else if(SESSION&&op.u!==SESSION.id&&this.mine.has(op.k)){const sig=op.k+'|'+op.t+'|'+op.u+'|'+op.s;if(!this.seen.has(sig)&&!jeq(op.v,this.mine.get(op.k).v)){this.seen.add(sig);older.push(op)}}}}
  this.older=older;return changed}
 get(k,d){const e=this.map.get(k);return e&&e.v!=null?e.v:d}
 meta_(k){return this.map.get(k)}
 set(k,v,o){o=o||{};if(!SESSION)return false;if(!o.sys&&!can('edit')&&!/^(wp|doc)\.[^.]+\.(ap|cm\.)/.test(k)){toast('دورك الحالي للقراءة فقط.','w');return false}
  if(!o.sys&&typeof keyLocked==='function'&&keyLocked(k,this)){toast('هذه الورقة معتمدة ومقفلة (مسار الاعتماد). أعد فتحها أولًا بمبرر.','w');return false}
  if(v===undefined)v=null;
  const prev=this.map.get(k);const pv=prev?prev.v:null;if(jeq(pv,v)||(pv==null&&v===''))return false;
  let tm=Date.now();if(prev&&prev.t>=tm)tm=prev.t+1;const op={k,v,t:tm,u:SESSION.id,s:++SEQ};
  this.map.set(k,{v,t:tm,u:op.u,s:op.s});this.ver++;this.mine.set(k,op);if(!o.noUndo)pushUndo(this,k,pv,o.label);SAVER.add(this.path,op);return true}
 setMany(obj,o){let n=0;for(const k in obj)if(this.set(k,obj[k],o))n++;return n}
 *entries(prefix){for(const [k,e] of this.map)if(k.startsWith(prefix)&&e.v!=null)yield [k,e.v]}
 async compact(){/* keep the active log small: move full history to _audit, keep only latest op per key */
  const name=writer()+'.jsonl',p=this.path+'/_ops/'+name;const st=await STORE.stat(p);if(!st||st.size<600000)return;
  await lockWrite(async()=>{const txt=await STORE.readText(p)||'';const last=new Map();for(const l of txt.split('\n')){if(!l)continue;try{const op=JSON.parse(l);const c=last.get(op.k);if(!c||cmpOp(c,op)<0)last.set(op.k,op)}catch(e){logErr('a3_engine:78 const op=JSON.parse(l);const c=last.get(op.k);if(!',e)}}
   await STORE.appendText(this.path+'/_audit/'+name,txt);await STORE.writeText(p,[...last.values()].map(o=>JSON.stringify(o)).join('\n')+'\n');delete this.files[name]})}}

/* ---------- Write-ahead journal: every operation is first written synchronously to localStorage,
   so closing the tab before the async write finishes never loses data (replayed at next start). ---------- */
const WAL={ok:true,key:()=>'meap.wal.'+STORE_ID+'.'+(SESSION?SESSION.id:'x'),
 all(){return LS.get(this.key(),[])},
 push(p,o){const a=this.all();a.push({p,o});this.ok=LS.set(this.key(),a)},
 drop(items){if(!items.length)return;const ids=new Set(items.map(x=>x.o.k+'|'+x.o.t+'|'+x.o.s));const a=this.all().filter(x=>!ids.has(x.o.k+'|'+x.o.t+'|'+x.o.s));this.ok=LS.set(this.key(),a)}};

const TEMP=new Map();
async function storeFor(path){if(CUR.eng&&CUR.eng.path===path)return CUR.eng;if(TEMP.has(path))return TEMP.get(path);const s=new EngStore(path);await s.load();TEMP.set(path,s);return s}

/* ---------- Autosave after every operation ---------- */
const SAVER={q:[],extra:new Map(),timer:0,busy:null,fails:0,state:'saved',err:'',lastOk:0,
 add(p,o){WAL.push(p,o);this.q.push({p,o});this.kick(300)},
 remat(p,groups){const s=this.extra.get(p)||new Set();groups.forEach(g=>s.add(g));this.extra.set(p,s);this.kick(900)},
 kick(ms){clearTimeout(this.timer);if(!this.fails)this.set('saving');this.timer=setTimeout(()=>this.flush(),ms)},
 set(s,e){this.state=s;this.err=e||'';if(typeof UI!=='undefined')UI.saveState()},
 pending(){return this.q.length>0||this.extra.size>0||!!this.busy},
 async flush(){clearTimeout(this.timer);if(this.busy){try{await this.busy}catch(e){logErr('a3_engine:98 await this.busy',e)}}
  if(!this.q.length&&!this.extra.size){if(this.state!=='error')this.set('saved');return}
  const batch=this.q.splice(0),extra=this.extra;this.extra=new Map();if(!this.fails)this.set('saving');
  this.busy=(async()=>{try{await this.write(batch,extra);this.fails=0;this.lastOk=Date.now();WAL.drop(batch);
     if(this.q.length||this.extra.size)this.kick(60);else this.set(WAL.ok?'saved':'error',WAL.ok?'':'تعذّر حفظ نسخة الطوارئ في ذاكرة المتصفح (المساحة ممتلئة) — الحفظ في المجلد ناجح.');try{BC&&BC.postMessage({t:'saved',store:STORE_ID})}catch(e){logErr('a3_engine:102 BC&&BC.postMessage({t:saved,store:STORE_ID})',e)}}
   catch(e){this.q.unshift(...batch);for(const [p,g] of extra){const s=this.extra.get(p)||new Set();g.forEach(x=>s.add(x));this.extra.set(p,s)}
    this.fails++;const wait=Math.min(30000,1000*Math.pow(2,Math.min(this.fails,5)));this.set('error',errMsg(e));if(this.fails===1&&typeof toast==='function')toast('فشل الحفظ: '+errMsg(e)+' — تعديلاتك محفوظة مؤقتًا على هذا الجهاز وستُعاد المحاولة تلقائيًا.','e',10000);this.nextRetry=Date.now()+wait;clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),wait)}
   finally{this.busy=null}})();
  return this.busy},
 async write(batch,extra){const by=new Map();for(const it of batch){if(!by.has(it.p))by.set(it.p,[]);by.get(it.p).push(it.o)}
  for(const path of new Set([...by.keys(),...extra.keys()])){
   if(!(await STORE.stat(path+'/engagement.json'))&&!(await STORE.stat(path+'/_ops')))throw Object.assign(new Error('مجلد الارتباط غير موجود: '+path),{name:'NotFoundError'});
   const store=await storeFor(path);const ops=by.get(path)||[];
   if(ops.length)await withRetry(()=>lockWrite(()=>STORE.appendText(path+'/_ops/'+writer()+'.jsonl',ops.map(o=>JSON.stringify(o)).join('\n')+'\n')));
   const groups=new Set(extra.get(path)||[]);ops.forEach(o=>groups.add(groupOf(o.k)));
   await materialize(store,groups);if(ops.length)store.compact().catch(e=>logErr('compact '+path,e,'warn'))}}};

/* ---------- Human-readable snapshots ---------- */
function groupOf(k){const p=k.split('.');if(p[0]==='wp')return 'wp:'+p[1]+(p[2]==='lk'||p[2]==='att'?'|graph':'');if(p[0]==='pp')return 'pp:'+p[1]+'|graph';if(p[0]==='ref')return 'ref:'+p[1]+'|graph';if(p[0]==='doc'||p[0]==='ml')return 'doc:'+(p[0]==='ml'?'mgmtletter':p[1]);if(p[0]==='f'||p[0]==='a'||p[0]==='r')return p[0]+':'+p[1]+(p[0]==='f'?'|graph':'');if(p[0]==='cwp')return 'eng|wp:'+p[1];return 'eng'}
const RECDIR={f:'findings',a:'adjustments',r:'review-notes',ref:'references'};
async function materialize(store,groups){const all=new Set();groups.forEach(g=>g.split('|').forEach(x=>all.add(x)));
 for(const g of all){const i_=g.indexOf(':');const kind=i_<0?g:g.slice(0,i_),id=i_<0?'':g.slice(i_+1);
  if(kind==='eng'){await withRetry(()=>STORE.writeText(store.path+'/engagement.json',JSON.stringify(engSnapshot(store),null,1)))}
  else if(kind==='wp'){const dir=store.path+'/working-papers/'+wpFolder(store,id);const cw=store.get('cwp.'+id);if(cw===null&&store.map.has('cwp.'+id)){continue}
   const snap=wpSnapshot(store,id);if(!snap)continue;await withRetry(()=>STORE.writeText(dir+'/data.json',JSON.stringify(snap.data,null,1)));await withRetry(()=>STORE.writeText(dir+'/links.json',JSON.stringify(snap.links,null,1)))}
  else if(kind==='pp'){const snap=ppSnapshot(store,id);const dir=store.path+'/procedures/'+procFolder(id);if(snap)await withRetry(()=>STORE.writeText(dir+'/data.json',JSON.stringify(snap,null,1)))}
  else if(kind==='graph'){await withRetry(()=>STORE.writeText(store.path+'/relations.json',JSON.stringify(relationsSnapshot(store),null,1)))}
  else if(kind==='doc'){const snap=docSnapshot(store,id);if(snap)await withRetry(()=>STORE.writeText(store.path+'/documents/'+sanitizeName(id,40)+'/data.json',JSON.stringify(snap,null,1)))}
  else if(RECDIR[kind]){const r=recOf(store,kind,id);const p=store.path+'/'+RECDIR[kind]+'/'+sanitizeName(id,40)+'.json';
   if(!r||r._del)await STORE.remove(p);else await withRetry(()=>STORE.writeText(p,JSON.stringify(Object.assign({format:'MEAP-'+RECDIR[kind],id},r),null,1)))}}}
function recOf(store,kind,id){const pre=kind+'.'+id+'.';let r=null;for(const [k,v] of store.entries(pre)){(r=r||{})[k.slice(pre.length)]=v}return r}
function recs(store,kind){const m={};for(const [k,v] of store.entries(kind+'.')){const p=k.split('.');const id=p[1],f=p.slice(2).join('.');if(!f)continue;(m[id]=m[id]||{id})[f]=v}
 return Object.values(m).filter(r=>!r._del).sort((a,b)=>(a.t||0)-(b.t||0))}

/* ---------- Undo (per session) ---------- */
const UNDO=[];
function pushUndo(store,k,prev,label){const top=UNDO[UNDO.length-1];const now=Date.now();if(top&&top.store===store&&top.k===k&&now-top.t<2500){top.t=now;return}
 UNDO.push({store,k,prev,label:label||'',t:now});if(UNDO.length>300)UNDO.shift();if(typeof UI!=='undefined')UI.undoState()}
function undo(){const u=UNDO.pop();if(typeof UI!=='undefined')UI.undoState();if(!u){toast('لا يوجد ما يمكن التراجع عنه.','i');return}
 u.store.set(u.k,u.prev,{noUndo:true});toast('تم التراجع عن آخر تعديل: '+keyLabel(u.k),'i');if(u.store===CUR.eng)UI.applyRemote(new Set([u.k]),[],true)}

/* ---------- Presence: who is working on which working paper ---------- */
const PRES={list:[],cur:{view:'',wp:''},last:0,
 async beat(force){if(!SESSION||!CUR.eng)return;const now=Date.now();if(!force&&now-this.last<40000)return;this.last=now;
  try{await STORE.writeText(CUR.eng.path+'/_presence/'+writer()+'.json',JSON.stringify({u:SESSION.id,device:DEVICE,view:this.cur.view,wp:this.cur.wp,t:now}))}catch(e){logErr('a3_engine:139 await STORE.writeText(CUR.eng.path+/_presence/+w',e)}},
 async read(){if(!CUR.eng){this.list=[];return}const dir=CUR.eng.path+'/_presence';const out=[];const now=Date.now();
  for(const f of await STORE.list(dir)){if(f.kind!=='file')continue;try{const p=JSON.parse(await STORE.readText(dir+'/'+f.name)||'null');if(p&&now-p.t<130000&&!(p.u===SESSION.id&&p.device===DEVICE))out.push(p)}catch(e){logErr('a3_engine:141 const p=JSON.parse(await STORE.readText(dir+/+f.',e)}}
  this.list=out}};
async function presenceLeave(){if(CUR.eng&&SESSION)await STORE.remove(CUR.eng.path+'/_presence/'+writer()+'.json')}

/* ---------- Background sync ---------- */
let BC=null;try{BC=new BroadcastChannel('meap')}catch(e){logErr('BroadcastChannel unsupported – cross-tab sync falls back to polling',e,'info')}
const SYNC={timer:0,running:false,fails:0,
 start(){this.stop();const loop=async()=>{await this.tick();this.timer=setTimeout(loop,(STORE.kind==='idb'?12:STORE.kind==='cloud'?Math.max(20,SETTINGS.poll||8):(SETTINGS.poll||8))*1000)};this.timer=setTimeout(loop,1500)},
 stop(){clearTimeout(this.timer)},
 async tick(){if(this.running||!SESSION)return;this.running=true;
  try{if(!(await checkSession())){UI.sessionEnded();return}
   if(CUR.eng){const store=CUR.eng;const ch=await store.pull();if(ch.length||(store.older&&store.older.length))onRemote(store,ch,store.older||[]);await PRES.beat();await PRES.read();UI.presence()}
   this.fails=0}
  catch(e){this.fails++;if(this.fails===3)toast('تعذّرت قراءة التحديثات من مجلد الحفظ: '+errMsg(e),'w')}
  finally{this.running=false}}};
if(BC)BC.onmessage=ev=>{if(ev.data&&ev.data.store===STORE_ID)setTimeout(()=>SYNC.tick(),200)};
function onRemote(store,ops,older){const keys=new Set(),conf=[],groups=new Set();
 for(const op of ops){keys.add(op.k);if(op.u!==SESSION.id){groups.add(groupOf(op.k));const m=store.mine.get(op.k);if(m&&Math.abs(op.t-m.t)<15*60000&&!jeq(op.v,m.v))conf.push({op,kept:'theirs'})}}
 for(const op of older)conf.push({op,kept:'mine'});
 if(groups.size)SAVER.remat(store.path,groups);
 if(store===CUR.eng)UI.applyRemote(keys,conf)}

/* ---------- Audit trail: every operation carries user + time ---------- */
async function readAudit(path){const out=[];const seen=new Set();
 for(const sub of ['_ops','_audit']){for(const f of await STORE.list(path+'/'+sub)){if(f.kind!=='file'||!f.name.endsWith('.jsonl'))continue;const txt=await STORE.readText(path+'/'+sub+'/'+f.name)||'';
  for(const l of txt.split('\n')){if(!l)continue;try{const o=JSON.parse(l);const sig=o.k+'|'+o.t+'|'+o.u+'|'+o.s;if(seen.has(sig))continue;seen.add(sig);out.push(o)}catch(e){logErr('a3_engine:166 const o=JSON.parse(l);const sig=o.k+|+o.t+|+o.',e)}}}}
 return out.sort((a,b)=>b.t-a.t)}

 const path=c._dir+'/'+sanitizeName(year,20);if(await STORE.stat(path+'/engagement.json'))throw new Error('يوجد ارتباط لهذه السنة بالفعل.');
 for(const d of ['_ops','findings','adjustments','review-notes','working-papers'])await STORE.mkdir(path+'/'+d);
 const store=new EngStore(path,{companyId:c.id,year});TEMP.set(path,store);
 await STORE.writeText(path+'/engagement.json',JSON.stringify({format:'MEAP-engagement',version:3,companyId:c.id,year,creating:true},null,1));
 const base={'eng.year':year,'eng.period':info.period||'','eng.fw':info.fw||'IFRS','eng.ind':info.ind||c.industry||'','eng.status':'active','eng.created':localISO(),'eng.createdBy':SESSION.id};
 Object.assign(base,seed||{});store.setMany(base,{sys:true,noUndo:true});await SAVER.flush();audit('engagement.create',{company:c.id,year});TEMP.delete(path);return path}

/* ================= a4 · UI primitives: toasts, in-page dialogs, table fitting, shell, status ================= */

 el.innerHTML=`<span>${esc(msg)}${action?` <button class="lnk" data-ta>${esc(action.label)}</button>`:''}</span><button aria-label="${esc(t('close'))}" data-tx>×</button>`;

/* In-page dialog: absolutely positioned inside the document, grows with its content and moves with the page scroll
   (no fixed height, no internal scrollbar). */
let DLG=null;
function openDlg(html,o){o=o||{};closeDlg();const root=$('#dlg');const bk=document.createElement('div');bk.className='dlg-bk';
 const box=document.createElement('div');box.className='dlg';box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');if(o.label)box.setAttribute('aria-label',o.label);
 box.style.top=(window.scrollY+Math.max(10,Math.min(60,innerHeight*.06)))+'px';box.innerHTML=html;root.append(bk,box);
 DLG={box,bk,prev:document.activeElement,onClose:o.onClose};bk.addEventListener('click',()=>closeDlg());

 const f=box.querySelector('[autofocus]')||box.querySelector('input:not([type=hidden]),select,textarea,button');f&&f.focus({preventScroll:true});return box}
function closeDlg(v){if(!DLG)return;const d=DLG;DLG=null;d.box.remove();d.bk.remove();try{d.onClose&&d.onClose(v)}catch(e){logErr('a4_ui:16 d.onClose&&d.onClose(v)',e)}if(d.prev&&d.prev.focus&&document.contains(d.prev))d.prev.focus({preventScroll:true})}
function ask(o){return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};
 const box=openDlg(`<h2>${esc(o.title)}</h2><div>${o.body||''}</div>${o.input?`<label class="fl" style="margin-top:.6rem">${esc(o.input.label)}<input class="in" data-ask autocomplete="off"></label>`:''}<p class="mut small" data-err></p><div class="acts"><button type="button" class="btn g" data-x="0">${esc(o.cancel||t('cancel'))}</button><button type="button" class="btn ${o.danger?'d':''}" data-x="1">${esc(o.ok||t('confirm'))}</button></div>`,{label:o.title,onClose:v=>fin(v||false)});
 box.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;if(b.dataset.x!=='1'){closeDlg(false);return}
  if(o.input){const v=box.querySelector('[data-ask]').value;if(o.input.must&&v.trim()!==o.input.must){box.querySelector('[data-err]').textContent='النص غير مطابق.';return}closeDlg(v||true)}else closeDlg(true)})})}
/* Form dialog: onOk(data) may throw → error is shown inside the dialog and it stays open */
function formDlg(o){return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};
 const box=openDlg(`<form data-dlgf novalidate><h2>${esc(o.title)}</h2>${o.html}<p class="note bad" data-err hidden></p><div class="acts"><button type="button" class="btn g" data-x>${esc(t('cancel'))}</button><button class="btn ${o.danger?'d':''}" type="submit">${esc(o.ok||t('save'))}</button></div></form>`,{label:o.title,onClose:v=>fin(v||null)});
 box.querySelector('[data-x]').onclick=()=>closeDlg(null);
 box.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const f=e.target;const data=Object.fromEntries(new FormData(f));$$('input[type=checkbox]',f).forEach(c=>{data[c.name]=c.checked});
  const btn=f.querySelector('[type=submit]');btn.disabled=true;const err=f.querySelector('[data-err]');err.hidden=true;
  try{const r=o.onOk?await o.onOk(data,f):data;closeDlg(r===undefined?data:r)}catch(x){err.textContent=errMsg(x);err.hidden=false;btn.disabled=false}});
 o.after&&o.after(box)})}

/* Tables: label every cell (for card mode) and stack the table into cards whenever it cannot fit its container. */
function labelTable(tb){const hr=tb.tHead&&tb.tHead.rows[tb.tHead.rows.length-1];if(!hr)return;const labels=[];for(const th of hr.cells){const span=th.colSpan||1;for(let i=0;i<span;i++)labels.push(th.textContent.trim())}
 for(const sec of [...tb.tBodies,tb.tFoot].filter(Boolean))for(const tr of sec.rows){let i=0;for(const c of tr.cells){if(!c.hasAttribute('data-label'))c.setAttribute('data-label',labels[i]||'');i+=c.colSpan||1}}}
function fitTables(root){root=root||document;const tabs=$$('.tw>table',root);tabs.forEach(labelTable);const vis=tabs.filter(tb=>tb.offsetParent!==null);
 vis.forEach(tb=>tb.classList.remove('stack'));
 const over=vis.filter(tb=>{const w=tb.parentElement.clientWidth;const tw=tb.getBoundingClientRect().width;if(tw>w+1)return true;const cols=tb.tHead&&tb.tHead.rows[0]?tb.tHead.rows[0].cells.length:0;
  if(cols>=4&&w/cols<78)return true;const tx=tb.querySelector('td.tx');return !!(tx&&tx.getBoundingClientRect().width<150&&cols>3)});
 over.forEach(tb=>tb.classList.add('stack'))}
let fitT=0;const refit=()=>{cancelAnimationFrame(fitT);fitT=requestAnimationFrame(()=>fitTables(document))};

 for(const [k,v] of CUR.eng.entries('pp.')){const x=/^pp\.(.+)\.(att|lk)\.([^.]+)$/.exec(k);if(!x||!v)continue;const r=get(x[1]);if(x[2]==='att'&&typeof v==='object'){r.a++;r.att.push(Object.assign({id:x[3]},v))}else if(x[2]==='lk'&&v.to){r.l++;r.links.push(Object.assign({id:x[3],from:x[1]},v))}}

function ppLinksTo(ref){const out=[];for(const [id,r] of ppIndex())for(const l of r.links)if(l.to===ref)out.push(l);return out}
